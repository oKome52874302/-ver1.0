<style>

</style>

<style>
/* Layout: one column — onboarding wizard first, then a pocket-sized money app: month switcher, summary tiles, ledger lists. */
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --ink:#1D2A24; --muted:#5B6A62; --line:#D6DFD7;
  --accent:#12795F; --tint:#DCEFE6; --pop:#F26B4F; --good:#2D7A4D; --warn:#A86A12; --bad:#AE3636;
  --good-bg:#E3F1E8; --warn-bg:#F7ECD9; --bad-bg:#F6E1E1;
  --bronze:#A8673A; --silver:#7D8A94; --gold:#B8901C; --locked:#C9D1CF;
  --med0:#D3DAD8; --med0-d:#B9C2C0; --med1:#D58A52; --med1-d:#A8673A; --med2:#AEBCC7; --med2-d:#7D8A94; --med3:#F2C641; --med3-d:#C99A12;
  --rib0:#C3CCCA; --rib1:#D2553F; --rib2:#3F6FB0; --rib3:#8A4FC0; --medline:rgba(255,255,255,.75); --medtext:#FFFFFF; --spark:#FFF6C9;
  --font-pop:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --j0:#C2571F; --j1:#2C5A86; --j2:#6B4FA0; --j3:#2D7A4D; --j4:#9A3E6A;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18211C; --ink:#E5EEE8; --muted:#94A39A; --line:#2A3730;
  --accent:#5CCBA6; --tint:#183128; --pop:#FF8A70; --good:#6CC08D; --warn:#E2B25C; --bad:#E57D7D;
  --good-bg:#1B2E23; --warn-bg:#33291A; --bad-bg:#341E1F; --j0:#EE9A62; --j1:#86ADD8; --j2:#B49AE0; --j3:#6CC08D; --j4:#E08BB4; --bronze:#D49163; --silver:#AEBAC2; --gold:#E6C04F; --locked:#36403F; --med0:#3B4645; --med0-d:#2C3534; --rib0:#323C3B; --medline:rgba(255,255,255,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18211C; --ink:#E5EEE8; --muted:#94A39A; --line:#2A3730;
  --accent:#5CCBA6; --tint:#183128; --pop:#FF8A70; --good:#6CC08D; --warn:#E2B25C; --bad:#E57D7D;
  --good-bg:#1B2E23; --warn-bg:#33291A; --bad-bg:#341E1F; --j0:#EE9A62; --j1:#86ADD8; --j2:#B49AE0; --j3:#6CC08D; --j4:#E08BB4; --bronze:#D49163; --silver:#AEBAC2; --gold:#E6C04F; --locked:#36403F; --med0:#3B4645; --med0-d:#2C3534; --rib0:#323C3B; --medline:rgba(255,255,255,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.25rem;font-weight:900;margin:0;letter-spacing:.02em}
h2{font-size:1rem;font-weight:700;margin:0;text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .label{font-family:var(--font-num);font-weight:600;font-size:1.05rem;min-width:7.5em;text-align:center}
button,.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.icon{padding:6px 10px}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}

nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.notice.warn{background:var(--warn-bg);border-color:transparent}
.notice.bad{background:var(--bad-bg);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--font-num);font-size:1.45rem;font-weight:600;line-height:1.3;word-break:break-all}
.tile .s{font-size:.78rem;color:var(--muted)}
.tile.neg .v{color:var(--bad)}
.tile.pos .v{color:var(--good)}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:last-child{grid-column:1 / -1}}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.alloc{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--tint)}
.alloc span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-fixed{background:var(--muted)} .c-save{background:var(--good)} .c-event{background:var(--accent)} .c-over{background:var(--bad)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px dashed var(--line);align-items:center}
.row:first-child{border-top:none}
.row .date{font-family:var(--font-num);font-size:.85rem;color:var(--muted);line-height:1.3}
.row .main{min-width:0}
.row .title{font-weight:700;overflow-wrap:anywhere}
.row .sub{font-size:.8rem;color:var(--muted)}
.row .amt{font-family:var(--font-num);text-align:right;font-weight:600;white-space:nowrap}
.row.off .title,.row.off .amt{text-decoration:line-through;color:var(--muted)}
.row .edit{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:480px){.row{grid-template-columns:3.8em minmax(0,1fr)}.row .amt{grid-column:2;text-align:left}.row .edit{grid-column:1 / -1}}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--tint);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.76rem;color:var(--muted)}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
input[inputmode=decimal]{font-family:var(--font-num);width:7.5em}
.live{font-family:var(--font-num);font-size:.84rem;background:var(--tint);color:var(--ink);border-radius:8px;padding:7px 10px}
input.w-s{width:5em!important} input.w-l{width:100%}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.job{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.job .jhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job .jhead input{flex:1 1 12em;font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter.over span{background:var(--bad)}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.ai{white-space:pre-wrap;font-size:.9rem;background:var(--bg);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.empty{padding:14px 0;color:var(--muted);font-size:.88rem}
.tablewrap{overflow-x:auto}
details summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.cand{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);align-items:center}
.cand .t{min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .wd.sun{color:var(--bad)} .cal .wd.sat{color:var(--accent)}
.day{min-width:0;min-height:64px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.day:hover{border-color:var(--accent)}
.day .dn{font-family:var(--font-num);font-size:.78rem;line-height:1.2}
.day.today .dn{font-weight:700;color:var(--accent)}
.day[aria-pressed="true"]{border:2px solid var(--accent);padding:3px;background:var(--tint)}
.day.blank{visibility:hidden}
.day .jc{display:block;font-size:.66rem;font-family:var(--font-num);line-height:1.35;padding:0 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--jc) 20%,var(--surface));color:var(--jc)}
.jdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--jc);margin-right:6px;vertical-align:-1px}
.dayform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.dayform input[type=time]{font-family:var(--font-num);width:7.2em}
.preview{font-family:var(--font-num);font-size:.86rem;background:var(--bg);border-radius:8px;padding:8px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,16px);max-width:min(92vw,460px);z-index:20;
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:.92rem;font-weight:500;
  box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--good);color:var(--surface)}
#toast.warn .mark{background:var(--warn)} #toast.bad .mark{background:var(--bad)}
#toast.saving .mark{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s ease,transform .2s ease}}
.tiles.four{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.tiles.four{grid-template-columns:1fr 1fr}.tiles.four .tile:last-child{grid-column:auto}}
.rankname{font-size:1.5rem;font-weight:900;letter-spacing:.04em}
.bcat{display:flex;flex-direction:column;gap:10px}
.bcat+.bcat{margin-top:8px}
.bcat-h{display:flex;justify-content:space-between;align-items:baseline}
.bcat-h h3{margin:0;font-size:.95rem;font-weight:900}
.bcat-h span{font-size:.78rem;font-weight:700;color:var(--muted);font-family:var(--font-num)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0;background:var(--bg)}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.15rem;color:var(--surface);background:var(--locked);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.badge.on.t1 .medal{background:var(--bronze)} .badge.on.t2 .medal{background:var(--silver)} .badge.on.t3 .medal{background:var(--gold)}
.badge:not(.on) .bt{color:var(--muted)}
.badge.on{background:var(--surface)}
.badge .bt{font-weight:700;font-size:.9rem;line-height:1.35}
.badge .bd{font-size:.74rem;color:var(--muted);line-height:1.4}
.badge .bdate{font-size:.72rem;color:var(--muted);font-family:var(--font-num)}
.badge .meter{width:100%;height:6px}
.savebox{display:flex;flex-direction:column;gap:8px}
.plan{font-size:.92rem;line-height:1.7}
.plan b{font-family:var(--font-num)}
.proj{width:100%;border-collapse:collapse;font-size:.84rem;font-family:var(--font-num)}
.proj th,.proj td{padding:5px 8px;text-align:right;border-top:1px dashed var(--line);white-space:nowrap}
.proj th:first-child,.proj td:first-child{text-align:left}
.proj th{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:.76rem;border-top:none}
.proj td.neg{color:var(--bad)}
#toast.trophy .mark{background:var(--gold)}
.brand{font-family:var(--font-pop);font-weight:400;font-size:1.45rem;color:var(--accent);letter-spacing:.02em}
body.in-onb #appHeader, body.in-onb nav.tabs{display:none}
.onb{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.odots{display:flex;gap:6px;justify-content:center}
.odot{width:28px;height:6px;border-radius:99px;background:var(--line)}
.odot.done{background:var(--accent)} .odot.cur{background:var(--pop)}
.ostep{display:flex;flex-direction:column;gap:14px}
.ostep-h{display:flex;flex-direction:column;gap:6px}
.ohero{display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;padding-top:12px}
.logo{font-family:var(--font-pop);font-size:3rem;line-height:1;color:var(--accent);transform:rotate(-3deg);text-shadow:4px 4px 0 var(--tint)}
.logo.small{font-size:2.2rem}
.olead{font-size:1.05rem;line-height:1.75;margin:0;text-wrap:balance}
.ofeat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;text-align:left}
.ofeat li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.ofeat b{color:var(--ink);font-size:.92rem}
@media (max-width:420px){.ofeat{grid-template-columns:1fr}}
.oh{font-family:var(--font-pop);font-weight:400;font-size:1.5rem;line-height:1.35}
.osub{margin:0;color:var(--muted);font-size:.9rem}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.choice input{grid-row:span 2;margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.choice .ct{font-weight:700} .choice .cd{font-size:.82rem;color:var(--muted)}
.choice.sel{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
.ocard{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ocard-h{display:flex;align-items:center;gap:4px} .ocard-h button{margin-left:auto}
.ocard input,.ocard select,.ostep .grid2 input{width:100%}
.opreview{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:.92rem}
.opreview b{font-family:var(--font-num)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border-radius:99px;border:2px solid var(--line);padding:6px 12px;font-weight:500}
.pchip.on{border-color:var(--accent);background:var(--tint);color:var(--accent)}
.fixlist{display:flex;flex-direction:column;gap:8px}
.fixrow{display:grid;grid-template-columns:minmax(0,1fr) 7.5em auto;gap:8px;align-items:center}
.fixrow input{width:100%!important}
.onav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.onav-r{display:flex;gap:8px}
button.big{font-family:var(--font-pop);font-weight:400;font-size:1.05rem;padding:11px 22px;border-radius:14px;box-shadow:3px 3px 0 var(--ink);border:2px solid var(--ink)}

.osum span{color:var(--muted);font-size:.85rem;flex:none} .osum b{text-align:right;min-width:0;overflow-wrap:anywhere}
.rankcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:18px;
  background:linear-gradient(135deg,var(--tint),var(--surface) 70%);border:2px solid var(--accent)}

.rk-s{font-size:.8rem;color:var(--muted)} .rk-s b{color:var(--ink);font-family:var(--font-num)}

.gotcount{font-family:var(--font-pop);text-align:center;line-height:1}.gotcount b{display:block;font-size:1.8rem;font-weight:400}.gotcount span{font-size:.8rem;color:var(--muted)}

.badge{font:inherit;color:inherit;border:2px solid var(--line);border-radius:16px;cursor:default}

.badge.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}

.badge.on.t1 .btier{color:var(--rib1)} .badge.on.t2 .btier{color:var(--rib2)} .badge.on.t3 .btier{color:var(--rib3)}
.badge:not(.on) .medalsvg{opacity:.8}
.badge .bdate{font-family:var(--font-pop);font-size:.72rem}

function saveLocal(){ if (db) return; try { localStorage.setItem(LS, JSON.stringify({settings:S.settings, shifts:S.shifts, events:S.events, income:S.income, ach:S.ach})); } catch(e){} }
function loadLocal(){ try { const o = JSON.parse(localStorage.getItem(LS) || "null"); if (o){ S.settings = Object.assign(clone(DEFAULTS), o.settings||{}); S.shifts = o.shifts||{}; S.events = o.events||{}; S.income = o.income||{}; S.ach = o.ach||{}; } } catch(e){} }
function dbErr(e){ toast("保存できませんでした（" + esc(e && (e.code || e.message) || "不明なエラー") + "）。通信状態を確認してもう一度変更してください。", "bad"); }
function saved(p, msg){
  // msg === false: background bookkeeping, no toast
  if (msg !== false) toast("保存中…", "saving");
  const done = () => { if (msg !== false) toast(msg || "保存しました"); };
  if (p) p.then(done, dbErr); else done();
}
// Saves re-render on the next tick, after the browser has moved focus to whatever the viewer tapped next,
// so render() can keep that field focused instead of replacing it mid-tap.
let renderQueued = false;
function renderSoon(){ if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 0); }
function persistSettings(msg){ if (db) saved(db.doc("app/settings").set(S.settings), msg); else { saveLocal(); saved(null, msg); } }
function putSettings(msg){ renderSoon(); if (db) saved(db.doc("app/settings").set(S.settings), msg); else { saveLocal(); saved(null, msg); } }
function putDoc(col, id, data, msg){
  if (data === null) delete S[col][id]; else S[col][id] = data;
  renderSoon();
  if (db){ const ref = db.doc(col + "/" + id); saved(data === null ? ref.delete() : ref.set(data), msg); }
  else { saveLocal(); saved(null, msg); }
}

/* ---------- calendar ---------- */
function normEvent(ev){
  if (!ev || ev.status === "cancelled" || !ev.start) return null;
  const allDay = !ev.start.dateTime;
  let s, e;
  if (allDay){
    const sd = String(ev.start.date||"").slice(0,10).split("-").map(Number);
    const ed = String((ev.end && ev.end.date) || "").slice(0,10).split("-").map(Number);
    s = jd(sd[0], sd[1], sd[2]);
    e = ed.length === 3 && ed[0] ? jd(ed[0], ed[1], ed[2]) : new Date(s.getTime() + 864e5);
  } else { s = new Date(ev.start.dateTime); e = new Date((ev.end && ev.end.dateTime) || ev.start.dateTime); }
  if (isNaN(s)) return null;
  const p = jp(s);
  return {id: ev.id, title: ev.summary || "（無題）", colorId: String(ev.colorId || ""), allDay, s, e, y:p.y, m:p.m, d:p.d, dow:p.dow, ymd:`${p.y}-${pad(p.m)}-${pad(p.d)}`, link: ev.htmlLink || ""};
}

async function fetchCalendar(year, refresh){
  if (!mcp){ S.calState = "none"; render(); return; }
  S.calState = "loading"; S.calError = null; render();
  const startTime = isoJ(jd(year-1, 11, 1)), endTime = isoJ(jd(year+1, 3, 1));
  const all = []; let token = null;
  try {
    for (let i = 0; i < 20; i++){
      const input = {startTime, endTime, pageSize:250, orderBy:"startTime", timeZone:"Asia/Tokyo"};
      if (token) input.pageToken = token;
      let r;
      try { r = await mcp.callTool(CAL, "list_events", input, {cache: refresh ? {staleTime:0, gcTime:3600e3, refresh:true} : {staleTime:300e3, gcTime:3600e3}}); }
      catch(e){
        if (e && e.retryable){ await new Promise(res => setTimeout(res, Math.min(e.retryAfterMs || 1500 + Math.random()*1000, 10000))); r = await mcp.callTool(CAL, "list_events", input); }
        else throw e;
      }
      const p = r && r.payload;
      const evs = (p && Array.isArray(p.events)) ? p.events : (Array.isArray(p) ? p : []);
      all.push(...evs);
      token = p && p.nextPageToken;
      if (!token) break;
    }
    const seen = new Set();
    S.cal = all.map(normEvent).filter(x => x && !seen.has(x.id) && seen.add(x.id)).sort((a,b) => a.s - b.s);
    S.calYear = year; S.calState = "ok"; S.fetchedAt = new Date();
  } catch(e){
    S.calState = "error";
    S.calError = (e && MCP_MSG[e.code]) || ("カレンダーを読み込めませんでした（" + esc((e && (e.code || e.message)) || "不明") + "）。少し待ってから「再取得」を押してください。");
  }
  render();
}

/* ---------- pay calculation ---------- */
const ignoreList = () => String(S.settings.ignoreTitles || "").split(/[,、]+/).map(x => x.trim()).filter(Boolean);
const jobBase = j => String(j.name || "").replace(/[（(].*$/, "").trim();
function linkedIds(){ const o = new Set(); for (const r of Object.values(S.shifts)) if (r.calEventId) o.add(r.calEventId); return o; }
function ignored(ev){
  if (linkedIds().has(ev.id)) return true;
  if (ignoreList().some(k => ev.title.includes(k))) return true;
  return S.settings.jobs.some(j => jobBase(j) && ev.title.includes(jobBase(j)));
}
function jobById(id){ return S.settings.jobs.find(j => j.id === id) || null; }
function jobIndex(id){ return Math.max(0, S.settings.jobs.findIndex(j => j.id === id)); }
const jColor = id => `var(--j${jobIndex(id) % 5})`;
function nightHours(s, e){
  let t = 0; const p = jp(s);
  for (let i = -1; i <= 2; i++){
    const ws = jd(p.y, p.m, p.d + i, 22), we = jd(p.y, p.m, p.d + i + 1, 5);
    t += Math.max(0, Math.min(e, we) - Math.max(s, ws));
  }
  return t / 36e5;
}
/* ---------- Japanese holidays & bank business days ---------- */
const holCache = {};
function holidaysOf(y){
  if (holCache[y]) return holCache[y];
  const h = {}, set = (m, d, n) => { h[`${y}-${pad(m)}-${pad(d)}`] = n; };
  const nthMon = (m, n) => { const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); return 1 + ((8 - first) % 7) + (n - 1) * 7; };
  set(1, 1, "元日"); set(1, nthMon(1, 2), "成人の日"); set(2, 11, "建国記念の日"); set(2, 23, "天皇誕生日");
  set(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), "春分の日");
  set(4, 29, "昭和の日"); set(5, 3, "憲法記念日"); set(5, 4, "みどりの日"); set(5, 5, "こどもの日");
  set(7, nthMon(7, 3), "海の日"); set(8, 11, "山の日"); set(9, nthMon(9, 3), "敬老の日");
  set(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), "秋分の日");
  set(10, nthMon(10, 2), "スポーツの日"); set(11, 3, "文化の日"); set(11, 23, "勤労感謝の日");
  const ymd = t => { const x = new Date(t); return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}`; };
  // 国民の休日: a weekday squeezed between two holidays
  for (const k of Object.keys(h)){
    const t = Date.UTC(y, Number(k.slice(5, 7)) - 1, Number(k.slice(8)));
    const mid = ymd(t + 864e5), after = ymd(t + 2 * 864e5);
    if (h[after] && !h[mid] && new Date(t + 864e5).getUTCDay() !== 0) h[mid] = "国民の休日";
  }
  // 振替休日: a holiday on Sunday moves to the next day that is not a holiday
  for (const k of Object.keys(h)){
    let t = Date.UTC(y, Number(k.slice(5, 7)) - 1, Number(k.slice(8)));
    if (new Date(t).getUTCDay() !== 0) continue;
    do { t += 864e5; } while (h[ymd(t)]);
    h[ymd(t)] = "振替休日";
  }
  return holCache[y] = h;
}
function closedReason(y, m, d){
  const k = `${y}-${pad(m)}-${pad(d)}`, dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  const hol = holidaysOf(y)[k];
  if (hol) return hol;
  if ((m === 12 && d === 31) || (m === 1 && d <= 3)) return "銀行休業日";
  return dow === 0 ? "日曜" : dow === 6 ? "土曜" : "";
}
/* Move a date off weekends/holidays: "prev" = 前営業日, "next" = 翌営業日, anything else = keep. */
function bizAdjust(y, m, d, mode){
  const orig = {y, m, d};
  if (mode !== "prev" && mode !== "next") return {y, m, d, moved: false};
  const reason = closedReason(y, m, d);
  if (!reason) return {y, m, d, moved: false};
  let t = Date.UTC(y, m - 1, d);
  for (let i = 0; i < 15; i++){
    t += mode === "prev" ? -864e5 : 864e5;
    const x = new Date(t);
    if (!closedReason(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()))
      return {y: x.getUTCFullYear(), m: x.getUTCMonth() + 1, d: x.getUTCDate(), moved: true, reason, from: orig};
  }
  return {y, m, d, moved: false};
}
const SHIFT_OPTS = [["prev", "前営業日にずらす"], ["next", "翌営業日にずらす"], ["none", "ずらさない"]];
const movedNote = p => p && p.moved ? `（${p.from.m}/${p.from.d}が${p.reason}のため${p.y * 10000 + p.m * 100 + p.d < p.from.y * 10000 + p.from.m * 100 + p.from.d ? "前倒し" : "後ろ倒し"}）` : "";

function payday(ev, job){
  let y = ev.y, m = ev.m; const c = num(job.cutoff);
  if (c > 0 && ev.d > c) m++;
  m += num(job.payOffset);
  while (m > 12){ m -= 12; y++; }
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const d = num(job.payDay) > 0 ? Math.min(num(job.payDay), last) : last;
  const a = bizAdjust(y, m, d, job.holidayShift || "prev");
  return {y: a.y, m: a.m, d: a.d, key: `${a.y}-${pad(a.m)}`, moved: a.moved, reason: a.reason, from: a.from};
}
const parseHM = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? [Number(m[1]), Number(m[2])] : null; };
/* r = {job, ymd, start, end, breakMin} — the same shape is used for saved shifts and for the live form preview */
function calcShift(r, job, id){
  const [y, m, d] = String(r.ymd).split("-").map(Number);
  const ev = {y, m, d, ymd: r.ymd, dow: new Date(Date.UTC(y, m - 1, d)).getUTCDay()};
  const a = parseHM(r.start), b = parseHM(r.end);
  let span = 0, night = 0, s = null, e = null;
  if (a && b){
    s = jd(y, m, d, a[0], a[1]); e = jd(y, m, d, b[0], b[1]);
    if (e <= s) e = new Date(e.getTime() + 864e5);   // ends after midnight
    span = (e - s) / 36e5;
  }
  const brk = Math.min(span, num(r.breakMin) / 60);
  const paid = Math.max(0, span - brk);
  if (s && job && job.night) night = Math.min(paid, nightHours(s, e));
  const weekend = ev.dow === 0 || ev.dow === 6;
  let pay = 0;
  if (job){
    if (job.payType === "fixed") pay = num(job.fixedPay);
    else pay = num(job.wage) * paid + num(job.wage) * 0.25 * night + (weekend && num(job.weekendExtra) ? num(job.weekendExtra) * paid : 0);
    pay = Math.floor(pay);
  }
  const hasTr = r.transport !== undefined && r.transport !== null && r.transport !== "";
  const transport = job ? (hasTr ? num(r.transport) : num(job.transport)) : 0;
  const wagePay = pay;
  pay += transport;
  const rateLabel = job && job.payType === "fixed" ? "1回の金額が未設定" : "時給が未設定";
  const needsRate = !job ? false : job.payType === "fixed" ? !num(job.fixedPay) : !num(job.wage);
  return {id, rec: r, ev, job, span, brk, paid, night, weekend, pay, rawPay: pay, wagePay, transport, excluded: false, needsRate,
          rateLabel, pd: job ? payday(ev, job) : {y, m, d, key: ""}, time: a && b ? `${r.start}–${r.end}` : ""};
}
function allShifts(){
  const out = [];
  for (const [id, r] of Object.entries(S.shifts)){ const j = jobById(r.job); if (j && r.ymd) out.push(calcShift(r, j, id)); }
  return out.sort((x, y) => (x.ev.ymd + (x.rec.start || "")).localeCompare(y.ev.ymd + (y.rec.start || "")));
}

function rateJob(){
  const js = S.settings.jobs.filter(j => j.payType === "hourly" && num(j.wage) > 0);
  return js.find(j => j.id === S.settings.rateJob) || js[0] || null;
}


/* ---------- shift → Google Calendar ---------- */
const CAL_ID = "primary";   // the viewer's own main calendar
const GCOLORS = [["1","ラベンダー"],["2","セージ"],["3","ブドウ"],["4","フラミンゴ"],["5","バナナ"],["6","ミカン"],["7","ピーコック"],["8","グラファイト"],["9","ブルーベリー"],["10","バジル"],["11","トマト"]];
const syncing = new Set();
function extractId(p){
  if (!p || typeof p !== "object") return "";
  return p.id || p.eventId || (p.event && p.event.id) || (p.result && p.result.id) || "";
}
function findExisting(r, job){
  // An event already in the calendar for the same day and job (e.g. one typed by hand before this app) is reused instead of duplicated.
  const linked = linkedIds(), base = jobBase(job);
  return S.cal.find(ev => ev.ymd === r.ymd && !linked.has(ev.id) &&
    ((base && ev.title.includes(base)) || (ev.title && job.name.includes(ev.title)))) || null;
}
function calTimes(r){
  const [y, m, d] = r.ymd.split("-").map(Number);
  const a = parseHM(r.start), b = parseHM(r.end);
  if (a && b){
    const st = jd(y, m, d, a[0], a[1]); let en = jd(y, m, d, b[0], b[1]);
    if (en <= st) en = new Date(en.getTime() + 864e5);
    return {startTime: isoJ(st), endTime: isoJ(en), allDay: false};
  }
  return {startTime: isoJ(jd(y, m, d)), endTime: isoJ(jd(y, m, d + 1)), allDay: true};
}
function calDesc(c){
  const lines = [];
  if (c.span) lines.push(`拘束 ${hrs(c.span)}h / 休憩 ${hrs(c.brk * 60)}分 / 実働 ${hrs(c.paid)}h`);
  if (!c.needsRate) lines.push(`見込み ${yen(c.pay)}（支給 ${c.pd.m}/${c.pd.d}）`);
  if (c.transport) lines.push(`交通費 ${yen(c.transport)}`);
  if (c.rec.note) lines.push(c.rec.note);
  lines.push("— バイト代と行事予算 から登録");
  return lines.join("\n");
}
const SYNC_MSG = {
  server_not_connected: "Google カレンダーが接続されていないため反映できません。claude.ai の「設定 → コネクタ」で追加してください。",
  needs_reauth: "Google カレンダーの再接続が必要です（claude.ai の「設定 → コネクタ」）。",
  not_in_manifest: "カレンダーへの書き込みが許可されていません。ページ右上のメニュー「権限」で Google Calendar を許可してください。",
  blocked_by_policy: "組織のポリシーでカレンダーへの書き込みが禁止されています。"
};
function setShiftMeta(id, patch){
  const cur = S.shifts[id]; if (!cur) return;
  putDoc("shifts", id, Object.assign({}, cur, patch), false);
}
async function syncShift(id, quiet){
  const r = S.shifts[id]; if (!r || !mcp || syncing.has(id)) return false;
  const job = jobById(r.job); if (!job) return false;
  syncing.add(id); render();
  const c = calcShift(r, job, id), t = calTimes(r);
  let evId = r.calEventId || "", adopted = !!r.calAdopted;
  try {
    if (!evId){ const ex = findExisting(r, job); if (ex){ evId = ex.id; adopted = true; } }
    if (evId){
      const upd = {eventId: evId, calendarId: CAL_ID, startTime: t.startTime, endTime: t.endTime, description: calDesc(c), notificationLevel: "NONE"};
      if (t.allDay) upd.allDay = true;
      if (!adopted){ upd.summary = job.name; upd.colorId = String(job.calColor || "6"); }
      try { await mcp.callTool(CAL, "update_event", upd, {cache: false}); }
      catch(e){
        if (e && e.code === "tool_error"){ evId = ""; adopted = false; }   // the event was deleted in Google Calendar: create it again
        else throw e;
      }
    }
    if (!evId){
      const res = await mcp.callTool(CAL, "create_event", {calendarId: CAL_ID, summary: job.name, colorId: String(job.calColor || "6"),
        description: calDesc(c), startTime: t.startTime, endTime: t.endTime, allDay: t.allDay, timeZone: "Asia/Tokyo", notificationLevel: "NONE"}, {cache: false});
      evId = extractId(res && res.payload);
      if (!evId) throw {code: "no_id", message: "作成した予定のIDを受け取れませんでした"};
    }
    syncing.delete(id);
    setShiftMeta(id, {calEventId: evId, calAdopted: adopted, calSync: "ok", calSyncedAt: new Date().toISOString()});
    if (!quiet) addNotice("", adopted ? "保存しました。カレンダーの同じ日の予定を、入力した時刻に合わせました" : "保存しました。Google カレンダーにも登録しました");
    return true;
  } catch(e){
    syncing.delete(id);
    // A timeout is ambiguous for a write: keep any id we have and let the viewer retry by hand.
    setShiftMeta(id, {calEventId: evId || r.calEventId || "", calAdopted: adopted, calSync: "error"});
    if (!quiet) addNotice("bad", (e && SYNC_MSG[e.code]) || `カレンダーに反映できませんでした（${esc((e && (e.code || e.message)) || "不明")}）。シフトの「反映」を押して再度お試しください。`);
    return false;
  }
}
async function unsyncShift(r){
  if (!r || !r.calEventId || !mcp) return;
  if (r.calAdopted){ return; }   // leave events the viewer created by hand; only unlink
  try { await mcp.callTool(CAL, "delete_event", {calendarId: CAL_ID, eventId: r.calEventId, notificationLevel: "NONE"}, {cache: false}); }
  catch(e){ if (!(e && e.code === "tool_error")) addNotice("bad", (e && SYNC_MSG[e.code]) || "カレンダーの予定を消せませんでした。Google カレンダーで直接削除してください。"); }
}
async function syncAll(ids){
  let ok = 0;
  for (const id of ids){ if (await syncShift(id, true)) ok++; }
  addNotice(ok === ids.length ? "" : "warn", `${ok} / ${ids.length} 件をカレンダーに反映しました。` + (ok < ids.length ? "失敗した分は各シフトの「反映」から再度お試しください。" : ""));
}
const needsSync = r => r.calSync !== "ok";

/* ---------- events ---------- */
function excludedRecurring(y, m){
  return (S.settings.recurring || []).filter(r => (S.events[`rc_${r.id}_${y}${pad(m)}`] || {}).included === false);
}
function eventList(y, m){
  const colors = String(S.settings.eventColors || "").split(/[,、\s]+/).filter(Boolean);
  const out = [];
  for (const ev of S.cal){
    if (ev.y !== y || ev.m !== m || ignored(ev)) continue;
    const doc = S.events[ev.id];
    const inc = doc && doc.included != null ? doc.included : colors.includes(ev.colorId);
    if (inc) out.push({id: ev.id, title: ev.title, ymd: ev.ymd, d: ev.d, dow: ev.dow, time: ev.allDay ? "終日" : hm(ev.s), doc: doc || {}, cal: true});
  }
  for (const r of (S.settings.recurring || [])){
    for (const off of [-1, 0, 1]){
      const [by, bm] = addMonths(y, m, off), blast = new Date(Date.UTC(by, bm, 0)).getUTCDate();
      const a = bizAdjust(by, bm, Math.min(Math.max(1, num(r.day) || 1), blast), r.holidayShift || "next");
      if (a.y !== y || a.m !== m) continue;
      const id = `rc_${r.id}_${by}${pad(bm)}`, doc = S.events[id] || {};   // the id stays on the scheduled month
      if (doc.included === false) continue;
      const merged = Object.assign({}, doc);
      if (!hasVal(merged.budget) && hasVal(r.budget)) merged.budget = num(r.budget);   // the monthly default until this month's amount is entered
      out.push({id, title: r.title || "毎月の行事", ymd: `${y}-${pad(m)}-${pad(a.d)}`, d: a.d, dow: new Date(Date.UTC(y, m - 1, a.d)).getUTCDay(), time: "毎月", doc: merged, cal: false, rec: r, moved: a});
    }
  }
  for (const [id, doc] of Object.entries(S.events)){
    if (!doc.manual || !doc.ymd) continue;
    const [yy, mm, dd] = doc.ymd.split("-").map(Number);
    if (yy === y && mm === m) out.push({id, title: doc.title || "（無題）", ymd: doc.ymd, d: dd, dow: new Date(Date.UTC(yy, mm-1, dd)).getUTCDay(), time: "手動", doc, cal: false});
  }
  return out.sort((a, b) => a.ymd.localeCompare(b.ymd));
}
function evCost(doc){ const a = doc.actual, b = doc.budget; const hasA = a !== undefined && a !== "" && a !== null; return hasA ? num(a) : num(b); }
function evStatus(doc){
  const hasB = doc.budget !== undefined && doc.budget !== "" && doc.budget !== null;
  const hasA = doc.actual !== undefined && doc.actual !== "" && doc.actual !== null;
  if (!hasB && !hasA) return ["warn", "予算未設定"];
  if (hasA && hasB && num(doc.actual) > num(doc.budget)) return ["bad", "超過 " + yen(num(doc.actual) - num(doc.budget))];
  if (hasA) return ["good", "精算済"];
  return ["", "予算あり"];
}

  const rows = S.settings.jobs.map(j => {
    const xs = payIn.filter(s => s.job.id === j.id);
    const est = xs.reduce((a, s) => a + s.pay, 0), tr = xs.reduce((a, s) => a + s.transport, 0);
    const confirmed = hasVal(conf[j.id]);
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const pd = xs[0] ? xs[0].pd : (() => { const a = bizAdjust(y, m, num(j.payDay) > 0 ? Math.min(num(j.payDay), last) : last, j.holidayShift || "prev"); return Object.assign(a, {key: `${a.y}-${pad(a.m)}`}); })();
    return {job: j, n: xs.length, hours: xs.reduce((a, s) => a + s.paid, 0), est, tr, confirmed, conf: confirmed ? num(conf[j.id]) : null, used: confirmed ? num(conf[j.id]) : est, pd};
  });

function summary(y, m){
  const key = `${y}-${pad(m)}`;
  const shifts = allShifts();
  const mi = budgetIncome(y, m, shifts);
  const payIn = mi.payIn;
  const income = mi.total;
  const byJob = {};
  for (const s of payIn){ const b = byJob[s.job.id] || (byJob[s.job.id] = {job: s.job, n:0, hours:0, pay:0, tr:0, pd:s.pd}); b.n++; b.hours += s.excluded ? 0 : s.paid; b.pay += s.pay; b.tr += s.transport; }
  const trIn = mi.estTr;
  const evs = eventList(y, m);
  const evTotal = evs.reduce((a, e) => a + evCost(e.doc), 0);
  const fixed = num(S.settings.fixedCost), save = savingFor(y, m);
  const free = income - fixed - save;
  const left = free - evTotal;
  let yearTr = 0, yearSum = 0;
  for (let mm = 1; mm <= 12; mm++){ const r = monthIncome(y, mm, shifts); yearSum += r.total; yearTr += r.estTr; }
  const yearPay = yearSum - (S.settings.wallTransport ? 0 : yearTr) + num(S.settings.otherIncome);
  const missingRate = payIn.some(s => s.needsRate && !s.excluded && !mi.rows.find(r => r.job.id === s.job.id).confirmed);
  const worked = shifts.filter(s => s.ev.y === y && s.ev.m === m);
  const workedPay = worked.reduce((a, s) => a + s.pay, 0);
  const pds = [...new Set(worked.map(s => `${s.pd.m}/${s.pd.d}`))];
  const workedPd = pds.length === 1 ? `${pds[0]}支給` : pds.length ? `${pds.join("・")}支給` : "";
  return {key, mi, payIn, income, trIn, yearTr, workedPay, workedPd, byJob, evs, evTotal, fixed, save, free, left, yearPay, missingRate};
}

function toast(html, kind){

function nextPayday(shifts){
  // earliest pay still to arrive (today or later), looking up to 3 months ahead
  let best = null;
  for (let i = 0; i < 4; i++){
    const [y, m] = addMonths(now.y, now.m, i);
    for (const r of monthIncome(y, m, shifts).rows){
      if (!r.used) continue;
      const ymd = `${r.pd.y}-${pad(r.pd.m)}-${pad(r.pd.d)}`;
      if (ymd < todayYmd) continue;
      if (!best || ymd < best.ymd) best = {ymd, rows: [r]};
      else if (ymd === best.ymd) best.rows.push(r);
    }
    if (best) break;
  }
  return best;
}

function tipsHtml(x, rj){
  const tips = [];
  const evs = x.evs.map(e => ({...e, c: evCost(e.doc)})).filter(e => e.c > 0).sort((a,b) => b.c - a.c);
  if (x.left < 0){
    tips.push(`<b>${yen(-x.left)}</b> 足りません。` + (rj ? `${esc(rj.name)}であと <b>約${Math.ceil(-x.left / num(rj.wage))}時間</b> 働くか、下の行事から削る必要があります。` : "下の行事から削る必要があります。"));
    let need = -x.left;
    const cut = [];
    for (const e of evs){ if (need <= 0) break; const c = Math.min(e.c * 0.2, need); cut.push(`${esc(e.title)} を2割（${yen(e.c * 0.2)}）削る`); need -= c; }
    if (cut.length) tips.push("大きい順に2割ずつ削る案：" + cut.join("、") + (need > 0 ? `。それでも ${yen(need)} 不足` : "。これで収まります"));
  } else if (x.income > 0) {
    tips.push(`今の予算なら <b>${yen(x.left)}</b> 残ります。余りを貯金目標に回すと年間 ${yen(x.left * 12)} のペースです。`);
  }
  const overs = x.evs.filter(e => evStatus(e.doc)[0] === "bad");
  if (overs.length) tips.push(`予算オーバー：${overs.map(e => esc(e.title)).join("、")}。次回は同種の行事の予算を実績に合わせて見直しましょう。`);
  const unset = x.evs.filter(e => evStatus(e.doc)[0] === "warn");
  if (unset.length) tips.push(`予算が未設定の行事が ${unset.length}件 あります（${unset.slice(0,4).map(e => esc(e.title)).join("、")}${unset.length > 4 ? " ほか" : ""}）。金額を入れると残りが正確になります。`);
  if (rj && evs[0]) tips.push(`一番大きい出費は「${esc(evs[0].title)}」の ${yen(evs[0].c)}。${esc(rj.name)}の約 ${hrs(evs[0].c / num(rj.wage))}時間分です。`);
  if (!tips.length) return `<div class="empty">給与と行事の予算を入れると、足りない額と削り方をここに出します。</div>`;
  return `<ul class="tips">${tips.map(t => `<li>${t}</li>`).join("")}</ul>`;
}

function defaultForm(){
  const job = S.settings.jobs[0];
  return formFor(job ? job.id : "");
}
function formFor(jobId){
  // Prefill with the most recent shift of this job, so repeating the usual hours is one tap.
  const last = Object.values(S.shifts).filter(r => r.job === jobId).sort((a, b) => (b.ymd || "").localeCompare(a.ymd || ""))[0];
  return {editId: null, job: jobId, start: last ? last.start || "" : "", end: last ? last.end || "" : "", breakMin: last ? (last.breakMin ?? "") : "", transport: last && last.transport !== undefined ? last.transport : "", note: ""};
}
function previewText(){
  const f = S.form; if (!f || !S.sel) return "";

  const c = calcShift({...f, ymd: S.sel}, job);
  const tr = c.transport ? ` ＋ 交通費 ${yen(c.transport)}` : "";

  if (!c.span) return "開始と終了の時刻を入れてください";
  return `拘束 ${hrs(c.span)}h − 休憩 ${hrs(c.brk * 60)}分 = 実働 ${hrs(c.paid)}h${c.night ? `（深夜 ${hrs(c.night)}h）` : ""} → ${c.needsRate ? c.rateLabel : `${yen(c.wagePay)}${tr} = ${yen(c.pay)}`}（支給 ${c.pd.m}/${c.pd.d}）`;

function viewEvents(){
  const x = summary(S.y, S.m), evs = x.evs, rj = rateJob();
  const d = S.evDraft || (S.evDraft = {title: "", ymd: "", budget: "", memo: "", group: ""});
  const inMonth = d.ymd && d.ymd.startsWith(`${S.y}-${pad(S.m)}`);
  const defDate = inMonth ? d.ymd : (now.y === S.y && now.m === S.m ? todayYmd : `${S.y}-${pad(S.m)}-01`);
  // budget overview
  const room = x.income - x.fixed - x.save, used = x.evTotal, pct = room > 0 ? Math.min(100, used / room * 100) : (used ? 100 : 0);
  const budgetCard = `<section class="block budgetcard">
      <div class="blockhead"><span class="small muted"><b>${S.m}月の行事・出費</b></span><span class="small muted">使えるお金 ${yen(room)}</span></div>
      <div class="bv">${yen(used)}</div>
      <div class="meter ${used > room ? "over" : ""}"><span style="width:${pct.toFixed(1)}%"></span></div>
      <span class="small muted">${used > room ? `<b style="color:var(--bad)">${yen(used - room)} 足りません</b>` : `あと <b style="color:var(--ink)">${yen(room - used)}</b> 余裕あり`}（固定費・貯金を引いたあと）</span>
    </section>`;
  // groups (a trip split into items) vs single events
  const groups = {}, singles = [];
  for (const e of evs){ const g = String(e.doc.group || "").trim(); if (g && !e.rec) (groups[g] = groups[g] || []).push(e); else singles.push(e); }
  const gList = Object.entries(groups).map(([name, items]) => ({name, items, total: items.reduce((a, e) => a + evCost(e.doc), 0)})).sort((a, b) => b.total - a.total);
  const groupCards = gList.map((g, gi) => {
    const top = g.items.slice().sort((a, b) => evCost(b.doc) - evCost(a.doc));
    const rest = top.slice(2), restSum = rest.reduce((a, e) => a + evCost(e.doc), 0);
    const ds = g.items.map(e => e.d), d1 = Math.min(...ds), d2 = Math.max(...ds);
    const key = "g:" + g.name;
    return `<section class="block groupcard ${gi === 0 ? "focus" : ""}">
      <div class="gh"><span style="display:flex;flex-direction:column;min-width:0"><b>${esc(g.name)}</b><span class="small muted">${S.m}/${d1}${d2 !== d1 ? `〜${d2}` : ""} ・ ${g.items.length}項目</span></span><span class="gt">${yen(g.total)}</span></div>
      <div class="gl">${top.slice(0, 2).map(e => `<span><span>${esc(e.title.replace(new RegExp("^" + g.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/旅行|一人旅/, "") + "[：:]?"), ""))}</span><b>${evCost(e.doc) ? yen(evCost(e.doc)) : "—"}</b></span>`).join("")}
        ${rest.length ? `<span class="rest"><span>ほか${rest.length}件</span><b>${yen(restSum)}</b></span>` : ""}</div>
      ${rj && g.total ? `<span class="pill" style="align-self:flex-start;background:var(--bg)">${esc(rj.name.replace(/（.*）/, ""))} ${Math.round(g.total / num(rj.wage))}時間分</span>` : ""}
      <details class="more" style="padding:0;background:none" data-more="${esc(key)}" ${S.openMore === key ? "open" : ""}><summary>項目を見る・編集</summary><div class="list" style="background:var(--bg)">${g.items.map(e => evRow(e, rj)).join("")}</div></details>
    </section>`;
  }).join("");
  const groupNames = [...new Set(Object.values(S.events).map(e => String(e.group || "").trim()).filter(Boolean))];
  return `
  ${budgetCard}
  ${groupCards}
  <div class="sec">
    ${gList.length ? `<div class="sec-h"><h2>そのほかの出費</h2></div>` : ""}
    <div class="list">${singles.map(e => evRow(e, rj)).join("") || `<div class="li"><span class="lm"><b>${gList.length ? "ほかの出費はありません" : `${S.m}月の行事はまだありません`}</b><span>下の「行事を追加」から入れてください</span></span></div>`}</div>
    ${excludedRecurring(S.y, S.m).map(r => `<div class="small muted">毎月の「${esc(r.title)}」を${S.m}月は外しています <button data-act="restoreRec" data-id="rc_${esc(r.id)}_${S.y}${pad(S.m)}">戻す</button></div>`).join("")}
  </div>

  <section class="block" id="addEvent">
    <div class="blockhead"><h2>行事を追加</h2><span class="small muted">${S.m}月以外の日付も選べます</span></div>
    <form id="manualForm" class="dayform" autocomplete="off">
      <label class="f" style="flex:2 1 12em">行事名<input type="text" class="w-l" id="mTitle" data-evdraft="title" required placeholder="例：ライブ、友達の誕生日プレゼント" value="${esc(d.title)}"></label>
      <label class="f">日付<input type="date" id="mDate" data-evdraft="ymd" required value="${esc(defDate)}"></label>
      <label class="f">予算<input type="text" inputmode="decimal" id="mBudget" data-evdraft="budget" placeholder="円" value="${esc(d.budget)}"></label>
      <label class="f" style="flex:1 1 10em">まとめる名前（任意）<input type="text" class="w-l" id="mGroup" data-evdraft="group" list="groupList" placeholder="例：石川旅行" value="${esc(d.group || "")}"></label>
      <input type="hidden" id="mMemo" value="">
      <button class="primary" type="submit">＋ 追加</button>
    </form>
    <datalist id="groupList">${groupNames.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>
    <div class="small muted">旅行のように項目が多いものは、同じ「まとめる名前」を付けると1枚のカードにまとまります。毎月の引き落としなどは <button data-goto="settings">設定</button> から。</div>
  </section>`;
}

/* ---------- AI ---------- */
async function askAI(){
  if (!sample || S.aiBusy) return;
  const x = summary(S.y, S.m); const rj = rateJob();
  const lines = x.evs.map(e => `- ${e.ymd} ${e.title}：予算 ${e.doc.budget ?? "未設定"} 円 / 実績 ${e.doc.actual ?? "未入力"} 円${e.doc.memo ? " / メモ：" + e.doc.memo : ""}`).join("\n") || "（行事なし）";
  const prompt = `あなたは名古屋在住の薬学部2年生の家計アドバイザーです。次の月の収支を見て、行事ごとの具体的なコストカット案を出してください。

対象月：${S.y}年${S.m}月
この月に使えるお金（前月振込の給料＋試験監督など当月分）：${Math.round(x.income)} 円（${x.mi.confirmedAll && x.mi.anyConfirmed ? "確定" : "一部見込み"}）
固定費：${x.fixed} 円 / 貯金目標：${x.save} 円
行事に使える額：${Math.round(x.free)} 円
行事の予算・出費合計：${Math.round(x.evTotal)} 円（差引 ${Math.round(x.left)} 円）
${rj ? `基準の時給：${rj.wage} 円（${rj.name}）` : ""}
行事一覧：
${lines}

出力ルール：
- 日本語。見出し記号（#）やMarkdownの太字は使わない。
- まず1行で「今月は〇〇円の余裕／不足」と結論。
- 次に行事ごとに「行事名：削り方（節約できる目安額）」を1〜2行。学割、早割、交通手段の変更、事前購入、持参などの現実的な手段に限る。
- 削らない方がよい出費（体験価値が高い・人間関係）にも一言触れる。
- 最後に来月に向けたひとことアドバイス。全体で400字程度。
- 金額が不明な行事は、一般的な相場を「目安」として示し、断定しない。`;
  S.aiBusy = true; S.ai[x.key] = "考えています…"; render();
  try {
    const r = await sample(prompt, {cache:false, onText: ({text}) => { S.ai[x.key] = text; const el = document.getElementById("aiOut"); if (el) el.textContent = text; }});
    S.ai[x.key] = r.text;
  } catch(e){
    if (e && e.code === "not_granted"){ S.ai[x.key] = "AIへの相談が許可されていないため使えません。"; }
    else if (e && e.code === "rate_limited"){ S.ai[x.key] = "利用が集中しています。しばらくしてからもう一度押してください。"; }
    else S.ai[x.key] = (e && e.text) || "回答を取得できませんでした（" + ((e && e.code) || "不明") + "）。もう一度押してください。";
  }
  S.aiBusy = false; render();
}

document.addEventListener("change", e => {

    if (t.dataset.form === "job" && S.form && !S.form.editId){ S.form = formFor(val); render(); }
    else if (t.dataset.form === "job"){ S.form.job = val; render(); }
    return;
  }
  if ((t.dataset.ev || t.dataset.set) && t.type !== "checkbox" && t.tagName !== "SELECT" && t.getAttribute("inputmode") === "decimal" && badNum(val)){
    toast("数字で入力してください", "warn"); return;
  }
  if (t.dataset.incJob !== undefined || t.dataset.incOther !== undefined){
    const k = t.dataset.incKey || `${S.y}-${pad(S.m)}`, d = clone(S.income[k] || {});
    if (t.dataset.incJob !== undefined){
      if (badNum(val)){ toast("数字で入力してください", "warn"); return; }
      d.jobs = d.jobs || {};
      const j = jobById(t.dataset.incJob);
      if (val === "") delete d.jobs[t.dataset.incJob]; else d.jobs[t.dataset.incJob] = num(val);
      putDoc("income", k, d, val === "" ? "確定額を空にしました" : `${Number(k.slice(5))}月振込の${esc(j ? j.name : "")}を ${yen(num(val))} で確定しました`);
    } else {
      const i = Number(t.dataset.incOther), f = t.dataset.field; d.others = d.others || [];
      if (!d.others[i]) return;
      if (f === "amount" && badNum(val)){ toast("数字で入力してください", "warn"); return; }

      putDoc("income", k, d, `${S.m}月の収入を保存しました`);
    }
    return;
  }
  if (t.dataset.ev){
    const id = t.dataset.ev, cur = Object.assign({}, S.events[id] || {});

    const fld = t.dataset.field;
    if (["budget","actual"].includes(fld) && badNum(val)){ toast("数字で入力してください", "warn"); return; }
    if (fld === "title" && !String(val).trim()){ toast("行事名を入れてください", "warn"); return; }
    if (fld === "ymd" && !val) return;
    cur[fld] = ["memo","title","ymd","group"].includes(fld) ? (fld === "title" || fld === "group" ? String(val).trim() : val) : (val === "" ? "" : num(val));
    if (fld === "ymd" && !val.startsWith(`${S.y}-${pad(S.m)}`)){ putDoc("events", id, cur, `「${esc(cur.title)}」を${Number(val.slice(5,7))}月${Number(val.slice(8))}日に移しました`); return; }
    putDoc("events", id, cur, `「${esc(cur.title || "行事")}」を保存しました`);
  } else if (t.dataset.job){
    const j = S.settings.jobs[Number(t.dataset.job)], f = t.dataset.field;
    if (t.type !== "checkbox" && t.tagName !== "SELECT"){ clearTimeout(typingTimer); if (f !== "name" && badNum(val)) return; }

    const f = (S.settings.fixedItems || [])[Number(t.dataset.fix)], fld = t.dataset.field; if (!f) return;
    if (fld === "amount" && badNum(val)){ toast("数字で入力してください", "warn"); return; }

    if (!["title","holidayShift"].includes(f) && badNum(val)){ toast("数字で入力してください", "warn"); return; }

    if (f === "day") r.day = Math.min(31, Math.max(1, num(val) || 1));
    putSettings(`「${esc(r.title || "毎月の行事")}」を保存しました`);
  } else if (t.dataset.set){

  if ((t.dataset.set || t.dataset.ev || t.dataset.fix !== undefined || t.dataset.rec !== undefined || t.dataset.incJob !== undefined || t.dataset.incOther !== undefined) && t.type !== "checkbox" && t.tagName !== "SELECT"){
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => t.isConnected && t.dispatchEvent(new Event("change", {bubbles: true})), 700);
    return;
  }
  if (t.dataset.form && S.form && t.dataset.form !== "job"){
    S.form[t.dataset.form] = t.value;
    const p = document.getElementById("preview"); if (p) p.textContent = previewText();
    return;
  }
  if (t.dataset.evdraft){ (S.evDraft = S.evDraft || {})[t.dataset.evdraft] = t.value; return; }
  if (t.id === "candFilter"){
    S.candFilter = t.value;
    const pos = t.selectionStart; render();
    const el = document.getElementById("candFilter"); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} }
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "shiftForm"){
    const f = S.form, job = jobById(f.job);
    if (!job){ addNotice("warn", "勤務先を選んでください。"); return; }
    if (job.payType === "hourly" && !(parseHM(f.start) && parseHM(f.end))){ addNotice("warn", "開始と終了の時刻を入れてください。"); return; }
    const prev = f.editId ? S.shifts[f.editId] || {} : {};
    const rec = {job: f.job, ymd: S.sel, start: f.start || "", end: f.end || "", breakMin: f.breakMin === "" ? 0 : num(f.breakMin), transport: f.transport === "" || f.transport == null ? "" : num(f.transport), note: (f.note || "").trim(),
                 calEventId: prev.calEventId || "", calAdopted: !!prev.calAdopted, calSync: prev.calEventId ? "pending" : ""};
    const id = f.editId || "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    if (prev.calAdopted && prev.job !== f.job){ rec.calEventId = ""; rec.calAdopted = false; }
    const msg = (f.editId ? `${S.sel.slice(5).replace("-", "/")} の ${esc(job.name)} を更新しました` : `${S.sel.slice(5).replace("-", "/")} に ${esc(job.name)} を保存しました`) + (S.settings.calSync && mcp ? "。カレンダーに反映しています…" : "");
    S.form = formFor(f.job);
    putDoc("shifts", id, rec, msg);
    if (S.settings.calSync && mcp) syncShift(id, false);
    return;
  }
  if (e.target.id !== "manualForm") return;
  const title = document.getElementById("mTitle").value.trim(), ymd = document.getElementById("mDate").value, b = document.getElementById("mBudget").value, memo = document.getElementById("mMemo").value.trim(), group = (document.getElementById("mGroup") || {value: ""}).value.trim();
  if (!title){ toast("行事名を入れてください", "warn"); return; }
  if (!ymd){ toast("日付を選んでください", "warn"); return; }
  if (badNum(b)){ toast("予算は数字で入力してください", "warn"); return; }
  S.evDraft = {title: "", ymd, budget: "", memo: "", group};
  const where = ymd.startsWith(`${S.y}-${pad(S.m)}`) ? "" : `（${Number(ymd.slice(5,7))}月に入りました）`;
  putDoc("events", "m" + Date.now().toString(36), {manual:true, included:true, title, ymd, budget: b === "" ? "" : num(b), memo, group}, `「${esc(title)}」を追加しました${where}`);
});

/* ---------- onboarding ---------- */
const ONB_STEPS = ["ようこそ", "バイト先", "貯金目標", "固定費", "完了"];
const FIX_PRESETS = [["スマホ代", 3000], ["サブスク", 1000], ["定期・交通費", 5000], ["家賃", 40000], ["ジム・習い事", 3000], ["部費・サークル費", 2000]];
const newJob = () => ({id: "j" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: "", payType: "hourly", wage: "", fixedPay: "", night: true, weekendExtra: 0, transport: "", cutoff: 0, payOffset: 1, payDay: 25, holidayShift: "prev", useLag: 1, calColor: "6"});
const fixTotal = () => (S.settings.fixedItems || []).reduce((a, f) => a + num(f.amount), 0);
function persist(){ S.settings.fixedCost = fixTotal(); saveLocal(); }
function onbGoalPreview(){
  const p = savingPlan();
  if (!p) return "目標額と期限を入れると、毎月いくら貯めればいいか計算します";
  if (!p.need) return "もう目標額に届いています！";
  return `あと ${yen(p.need)}。${Number(p.gm.slice(0, 4))}年${Number(p.gm.slice(5))}月まで${p.left}か月なので、毎月 ${yen(p.perMonth)} 貯めればOK`;
}
const PAY_PRESETS = [
  {l: "月末締め・翌月25日", c: 0, o: 1, d: 25},
  {l: "15日締め・当月25日", c: 15, o: 0, d: 25},
  {l: "20日締め・翌月10日", c: 20, o: 1, d: 10},
  {l: "月末締め・翌月末日", c: 0, o: 1, d: 0}
];
const presetOf = j => PAY_PRESETS.findIndex(p => p.c === num(j.cutoff) && p.o === num(j.payOffset) && p.d === num(j.payDay));
function viewOnboarding(){
  const st = S.settings, step = S.onbStep || 0;
  S.onbCustom = S.onbCustom || {};
  const top = step >= 1 && step <= 3 ? `<div class="otop">
      <button type="button" class="oback" data-onb="back" aria-label="もどる">‹</button>
      <div class="oprog" aria-hidden="true">${[1, 2, 3].map(i => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>
      <span class="ocount">${step}/3</span></div>` : "";
  const cta = (label, skip) => `<div class="octa"><button type="button" class="primary big" data-onb="next">${label}</button>${skip ? `<button type="button" class="skip" data-onb="next">あとで設定する</button>` : ""}</div>`;
  let body = "";
  if (step === 0) body = `
    <div class="ohero">
      <div class="logo">シフポケ</div>
      <p class="olead">シフトを入れるだけで、バイト代を自動で計算。<br>今月いくら使えて、いくら貯まるかがひと目でわかります。</p>
      <ul class="ofeat"><li><b>給料を自動計算</b>深夜割増・交通費・休日の振込ずれまで</li><li><b>行事ごとに予算</b>旅行やライブの出費を先回りで</li><li><b>貯金目標から逆算</b>毎月自由に使えるお金がわかる</li><li><b>実績を集める</b>月5万・年間100万…メダルで記録</li></ul>
      <p class="small muted">ログイン不要。入力したデータはこの端末のブラウザにだけ保存されます。設定は1分ほどで終わります。</p>
    </div>${cta("はじめる")}`;
  if (step === 1){
    const jobs = st.jobs.length ? st.jobs : (st.jobs = [newJob()]);
    body = `<div class="ostep-h"><h2 class="oh">どこで<br>バイトしてる？</h2><p class="osub">給料の計算に使います。深夜割増などの細かい設定はあとで変えられます。</p></div>
      ${jobs.map((j, i) => {
        const pi = presetOf(j), custom = S.onbCustom[i] || pi < 0;
        return `<div class="ocard">
        <div class="ocard-h"><span class="jdot" style="--jc:var(--j${i % 5})"></span><b>${jobs.length > 1 ? `バイト先 ${i + 1}` : "バイト先"}</b>${jobs.length > 1 ? `<button type="button" class="ghost" data-onb="deljob" data-i="${i}">削除</button>` : ""}</div>
        <label class="f">名前<input type="text" id="oj-n-${i}" data-o="jobs.${i}.name" value="${esc(j.name)}" placeholder="例：カフェ、塾講師、コンビニ"></label>
        <div class="seg" role="group" aria-label="給料の形">
          <button type="button" data-onb="ptype" data-i="${i}" data-v="hourly" aria-pressed="${j.payType === "hourly"}">時給</button>
          <button type="button" data-onb="ptype" data-i="${i}" data-v="fixed" aria-pressed="${j.payType === "fixed"}">1回いくら</button>
        </div>
        <div class="grid2">
          ${j.payType === "hourly" ? `<label class="f">時給<input type="text" inputmode="decimal" id="oj-w-${i}" data-o="jobs.${i}.wage" value="${esc(j.wage)}" placeholder="例：1100"></label>`
            : `<label class="f">1回の金額<input type="text" inputmode="decimal" id="oj-f-${i}" data-o="jobs.${i}.fixedPay" value="${esc(j.fixedPay)}" placeholder="例：8000"></label>`}
          <label class="f">交通費（1回）<input type="text" inputmode="decimal" id="oj-c-${i}" data-o="jobs.${i}.transport" value="${esc(j.transport)}" placeholder="なし"></label>
        </div>
        <div class="f">給料日
          <div class="opay">${PAY_PRESETS.map((p, k) => `<button type="button" data-onb="paypreset" data-i="${i}" data-p="${k}" aria-pressed="${!custom && pi === k}">${p.l}</button>`).join("")}
            <button type="button" data-onb="paycustom" data-i="${i}" aria-pressed="${custom}">ほかの日にち</button></div>
        </div>
        ${custom ? `<div class="grid2">
          <label class="f">締め日<select id="oj-x-${i}" data-o="jobs.${i}.cutoff">${[[0, "月末"], [5, "5日"], [10, "10日"], [15, "15日"], [20, "20日"], [25, "25日"]].map(([v, n]) => `<option value="${v}" ${num(j.cutoff) === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
          <label class="f">給料が出る月<select id="oj-o-${i}" data-o="jobs.${i}.payOffset"><option value="0" ${num(j.payOffset) === 0 ? "selected" : ""}>締めた月</option><option value="1" ${num(j.payOffset) === 1 ? "selected" : ""}>翌月</option><option value="2" ${num(j.payOffset) === 2 ? "selected" : ""}>翌々月</option></select></label>
          <label class="f">給料日<select id="oj-d-${i}" data-o="jobs.${i}.payDay">${[1, 5, 10, 15, 20, 25, 0].map(v => `<option value="${v}" ${num(j.payDay) === v ? "selected" : ""}>${v ? v + "日" : "末日"}</option>`).join("")}</select></label>
        </div>` : ""}
      </div>`; }).join("")}
      <button type="button" class="ghost" style="align-self:flex-start;color:var(--accent);font-weight:900" data-onb="addjob">＋ バイト先をもう1つ追加</button>
      ${cta("つぎへ", true)}`;
  }
  if (step === 2) body = `<div class="ostep-h"><h2 class="oh">貯金の目標は？</h2><p class="osub">今の残高と目標から、毎月貯める額と「自由に使えるお金」を出します。</p></div>
      <div class="ocard"><div class="grid2">
        <label class="f">今の口座残高<input type="text" inputmode="decimal" id="og-b" data-o="balance" value="${esc(st.balance ?? "")}" placeholder="例：50000"></label>
        <label class="f">貯金目標額<input type="text" inputmode="decimal" id="og-g" data-o="goalAmount" value="${esc(st.goalAmount ?? "")}" placeholder="例：200000"></label>
        <label class="f" style="grid-column:1 / -1">いつまでに<input type="month" id="og-m" data-o="goalMonth" value="${esc(st.goalMonth || "")}"></label>
      </div></div>
      <div class="opreview" id="onbGoal">${esc(onbGoalPreview())}</div>
      ${cta("つぎへ", true)}`;
  if (step === 3){
    const items = st.fixedItems || (st.fixedItems = []);
    const card = (st.recurring || []).find(r => r.id === "card");
    body = `<div class="ostep-h"><h2 class="oh">毎月かならず<br>出ていくお金は？</h2><p class="osub">タップで追加して、金額を自分の額に直してください。</p></div>
      <div class="chips">${FIX_PRESETS.map(([n, a]) => `<button type="button" class="pchip ${items.some(f => f.name === n) ? "on" : ""}" data-onb="preset" data-name="${n}" data-amount="${a}" aria-pressed="${items.some(f => f.name === n)}">${items.some(f => f.name === n) ? "✓ " : "＋ "}${n}</button>`).join("")}</div>
      ${items.length ? `<div class="ocard"><div class="fixlist">${items.map((f, i) => `<div class="fixrow">
          <input type="text" id="of-n-${i}" data-o="fixedItems.${i}.name" value="${esc(f.name)}" placeholder="名前" aria-label="名前">
          <input type="text" inputmode="decimal" id="of-a-${i}" data-o="fixedItems.${i}.amount" value="${esc(f.amount)}" placeholder="円" aria-label="金額">
          <button type="button" class="ghost" data-onb="delfix" data-i="${i}" aria-label="${esc(f.name || "固定費")}を削除">×</button></div>`).join("")}</div></div>` : ""}
      <button type="button" class="ghost" style="align-self:flex-start;color:var(--accent);font-weight:900" data-onb="addfix">＋ ほかの固定費</button>
      <div class="opreview">固定費の合計 <b id="onbFix">${yen(fixTotal())}</b> / 月</div>
      <label class="choice ${card ? "sel" : ""}"><input type="checkbox" data-onb-card="1" ${card ? "checked" : ""}><span class="ct">クレジットカードの引き落としも管理する</span><span class="cd">毎月の引き落とし日に出費として入ります。金額は毎月入力します。</span></label>
      ${card ? `<div class="grid2"><label class="f">引き落とし日<select id="oc-d" data-o="card.day">${Array.from({length: 28}, (_, i) => i + 1).map(v => `<option value="${v}" ${num(card.day) === v ? "selected" : ""}>${v}日</option>`).join("")}</select></label>
        <label class="f">土日祝のとき<select id="oc-h" data-o="card.holidayShift">${SHIFT_OPTS.map(([v, n]) => `<option value="${v}" ${(card.holidayShift || "next") === v ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>` : ""}
      ${cta("つぎへ")}`;
  }
  if (step === 4){
    const p = savingPlan(), jobs = st.jobs.filter(j => j.name);
    body = `<div class="ohero">
      <div class="logo small">準備OK！</div>
      <ul class="osum">
        <li><span>バイト先</span><b>${jobs.length ? jobs.map(j => esc(j.name)).join("、") : "あとで登録"}</b></li>
        <li><span>貯金</span><b>${p ? `毎月 ${yen(p.perMonth)}（${Number(p.gm.slice(5))}月までに ${yen(p.goal)}）` : "あとで設定"}</b></li>
        <li><span>固定費</span><b>${yen(fixTotal())} / 月</b></li>
      </ul>
      <p class="small muted">まずは下の「＋」から、働いた日のシフトを入れてみましょう。</p>
    </div>${cta("シフポケをはじめる")}`;
  }
  return `<div class="onb">${top}<div class="ostep">${body}</div></div>`;
}
function setPath(path, val){
  const parts = path.split(".");
  if (parts[0] === "card"){ const c = (S.settings.recurring || []).find(r => r.id === "card"); if (c) c[parts[1]] = parts[1] === "day" ? num(val) : val; return; }
  let o = S.settings;
  for (let i = 0; i < parts.length - 1; i++) o = o[isNaN(parts[i]) ? parts[i] : Number(parts[i])];
  const k = parts[parts.length - 1];
  const numeric = ["wage", "fixedPay", "transport", "amount", "balance", "goalAmount"];
  o[k] = numeric.includes(k) ? (val === "" ? "" : num(val)) : ["cutoff", "payOffset", "payDay"].includes(k) ? num(val) : val;
}
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset.o || S.settings.onboarded) return;
  if (t.type === "radio" || t.tagName === "SELECT") return;
  if (t.getAttribute("inputmode") === "decimal" && badNum(t.value)){ toast("数字で入力してください", "warn"); return; }
  setPath(t.dataset.o, t.value); persist();
  const g = document.getElementById("onbGoal"); if (g) g.textContent = onbGoalPreview();
  const f = document.getElementById("onbFix"); if (f) f.textContent = yen(fixTotal());
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.onbCard){
    S.settings.recurring = (S.settings.recurring || []).filter(r => r.id !== "card");
    if (t.checked) S.settings.recurring.push({id: "card", title: "クレジットカード引き落とし", day: 10, budget: "", holidayShift: "next"});
    persist(); render(); return;
  }
  if (!t.dataset.o || S.settings.onboarded) return;
  if (t.type === "radio" || t.tagName === "SELECT" || t.type === "month"){ setPath(t.dataset.o, t.value); persist(); render(); }
}, true);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-onb]"); if (!b) return;
  const a = b.dataset.onb, st = S.settings;
  if (a === "next"){
    if (S.onbStep === 1) st.jobs = st.jobs.filter(j => String(j.name).trim());
    if (S.onbStep === 3) st.fixedItems = (st.fixedItems || []).filter(f => String(f.name).trim() || num(f.amount));
    if (S.onbStep >= ONB_STEPS.length - 1){ st.onboarded = true; S.tab = "home"; persist(); render(); toast("ようこそ、シフポケへ！"); window.scrollTo(0, 0); return; }
    S.onbStep = (S.onbStep || 0) + 1;
  }
  else if (a === "back") S.onbStep = Math.max(0, (S.onbStep || 0) - 1);
  else if (a === "addjob") st.jobs.push(newJob());
  else if (a === "ptype") st.jobs[Number(b.dataset.i)].payType = b.dataset.v;
  else if (a === "paypreset"){ const j = st.jobs[Number(b.dataset.i)], pp = PAY_PRESETS[Number(b.dataset.p)]; j.cutoff = pp.c; j.payOffset = pp.o; j.payDay = pp.d; S.onbCustom[b.dataset.i] = false; }
  else if (a === "paycustom") S.onbCustom[b.dataset.i] = true;
  else if (a === "deljob") st.jobs.splice(Number(b.dataset.i), 1);
  else if (a === "preset"){
    const items = st.fixedItems || (st.fixedItems = []), n = b.dataset.name, i = items.findIndex(f => f.name === n);
    if (i >= 0) items.splice(i, 1); else items.push({name: n, amount: num(b.dataset.amount)});
  }
  else if (a === "addfix"){ (st.fixedItems = st.fixedItems || []).push({name: "", amount: ""}); persist(); render(); const el = document.getElementById("of-n-" + (st.fixedItems.length - 1)); if (el) el.focus(); return; }
  else if (a === "delfix") st.fixedItems.splice(Number(b.dataset.i), 1);
  else if (a === "restart"){ if (S.confirmDel !== "restart"){ S.confirmDel = "restart"; render(); return; } S.confirmDel = null; st.onboarded = false; S.onbStep = 1; }
  else if (a === "wipe"){
    if (S.confirmDel !== "wipe"){ S.confirmDel = "wipe"; render(); return; }
    try { localStorage.removeItem(LS); } catch(_){}
    S.confirmDel = null; S.settings = clone(DEFAULTS); S.shifts = {}; S.events = {}; S.income = {}; S.ach = {}; S.onbStep = 0;
    render(); toast("データを消しました"); return;
  }
  persist(); render(); if (a === "next" || a === "back" || a === "restart") window.scrollTo(0, 0);
});

/* ---------- boot ---------- */
loadLocal();
Object.keys(S.ready).forEach(k => { S.ready[k] = true; });
S.calState = "off";
render();
})();
</script>
</body>
</html>

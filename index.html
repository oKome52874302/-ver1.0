<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シフポケ</title>
<meta name="description" content="シフトを入れるだけでバイト代を自動計算。今月いくら使えて、いくら貯まるかがひと目でわかる学生向けアプリ。">
<meta name="theme-color" content="#F2F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シフポケ">
<style>
/* base reset */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Dela+Gothic+One&family=Monomaniac+One&family=Russo+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column — onboarding wizard first, then a pocket-sized money app: month switcher, summary tiles, ledger lists. */
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --ink:#1D2A24; --muted:#5B6A62; --line:#D6DFD7;
  --accent:#12795F; --tint:#DCEFE6; --pop:#F26B4F; --good:#2D7A4D; --warn:#A86A12; --bad:#AE3636;
  --good-bg:#E3F1E8; --warn-bg:#F7ECD9; --bad-bg:#F6E1E1;
  --bronze:#A8673A; --silver:#7D8A94; --gold:#B8901C; --locked:#C9D1CF;
  --med0:#D3DAD8; --med0-d:#B9C2C0; --med1:#D58A52; --med1-d:#A8673A; --med2:#AEBCC7; --med2-d:#7D8A94; --med3:#F2C641; --med3-d:#C99A12;
  --rib0:#C3CCCA; --rib1:#D2553F; --rib2:#3F6FB0; --rib3:#8A4FC0; --medline:rgba(255,255,255,.75); --medtext:#FFFFFF; --spark:#FFF6C9;
  --font-pop:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --font-ach:"Monomaniac One","Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --font-en:"Russo One","Monomaniac One",sans-serif;
  --med4:url(#legendFill); --rib4:#1D2A24;
  --j0:#C2571F; --j1:#2C5A86; --j2:#6B4FA0; --j3:#2D7A4D; --j4:#9A3E6A;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18211C; --ink:#E5EEE8; --muted:#94A39A; --line:#2A3730;
  --accent:#5CCBA6; --tint:#183128; --pop:#FF8A70; --good:#6CC08D; --warn:#E2B25C; --bad:#E57D7D;
  --good-bg:#1B2E23; --warn-bg:#33291A; --bad-bg:#341E1F; --j0:#EE9A62; --j1:#86ADD8; --j2:#B49AE0; --j3:#6CC08D; --j4:#E08BB4; --bronze:#D49163; --silver:#AEBAC2; --gold:#E6C04F; --locked:#36403F; --med0:#3B4645; --med0-d:#2C3534; --rib0:#323C3B; --medline:rgba(255,255,255,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18211C; --ink:#E5EEE8; --muted:#94A39A; --line:#2A3730;
  --accent:#5CCBA6; --tint:#183128; --pop:#FF8A70; --good:#6CC08D; --warn:#E2B25C; --bad:#E57D7D;
  --good-bg:#1B2E23; --warn-bg:#33291A; --bad-bg:#341E1F; --j0:#EE9A62; --j1:#86ADD8; --j2:#B49AE0; --j3:#6CC08D; --j4:#E08BB4; --bronze:#D49163; --silver:#AEBAC2; --gold:#E6C04F; --locked:#36403F; --med0:#3B4645; --med0-d:#2C3534; --rib0:#323C3B; --medline:rgba(255,255,255,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.25rem;font-weight:900;margin:0;letter-spacing:.02em}
h2{font-size:1rem;font-weight:700;margin:0;text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .label{font-family:var(--font-num);font-weight:600;font-size:1.05rem;min-width:7.5em;text-align:center}
button,.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.icon{padding:6px 10px}
button:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.notice.warn{background:var(--warn-bg);border-color:transparent}
.notice.bad{background:var(--bad-bg);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--font-num);font-size:1.45rem;font-weight:600;line-height:1.3;word-break:break-all}
.tile .s{font-size:.78rem;color:var(--muted)}
.tile.neg .v{color:var(--bad)}
.tile.pos .v{color:var(--good)}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:last-child{grid-column:1 / -1}}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.alloc{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--tint)}
.alloc span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-fixed{background:var(--muted)} .c-save{background:var(--good)} .c-event{background:var(--accent)} .c-over{background:var(--bad)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px dashed var(--line);align-items:center}
.row:first-child{border-top:none}
.row .date{font-family:var(--font-num);font-size:.85rem;color:var(--muted);line-height:1.3}
.row .main{min-width:0}
.row .title{font-weight:700;overflow-wrap:anywhere}
.row .sub{font-size:.8rem;color:var(--muted)}
.row .amt{font-family:var(--font-num);text-align:right;font-weight:600;white-space:nowrap}
.row.off .title,.row.off .amt{text-decoration:line-through;color:var(--muted)}
.row .edit{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:480px){.row{grid-template-columns:3.8em minmax(0,1fr)}.row .amt{grid-column:2;text-align:left}.row .edit{grid-column:1 / -1}}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--tint);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.76rem;color:var(--muted)}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
input[inputmode=decimal]{font-family:var(--font-num);width:7.5em}
.live{font-family:var(--font-num);font-size:.84rem;background:var(--tint);color:var(--ink);border-radius:8px;padding:7px 10px}
input.w-s{width:5em!important} input.w-l{width:100%}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.job{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.job .jhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job .jhead input{flex:1 1 12em;font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter.over span{background:var(--bad)}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.ai{white-space:pre-wrap;font-size:.9rem;background:var(--bg);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.empty{padding:14px 0;color:var(--muted);font-size:.88rem}
.tablewrap{overflow-x:auto}
details summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.cand{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);align-items:center}
.cand .t{min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .wd.sun{color:var(--bad)} .cal .wd.sat{color:var(--accent)}
.day{min-width:0;min-height:64px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.day:hover{border-color:var(--accent)}
.day .dn{font-family:var(--font-num);font-size:.78rem;line-height:1.2}
.day.today .dn{font-weight:700;color:var(--accent)}
.day[aria-pressed="true"]{border:2px solid var(--accent);padding:3px;background:var(--tint)}
.day.blank{visibility:hidden}
.day .jc{display:block;font-size:.66rem;font-family:var(--font-num);line-height:1.35;padding:0 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--jc) 20%,var(--surface));color:var(--jc)}
.jdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--jc);margin-right:6px;vertical-align:-1px}
.dayform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
/* 文字の大きさ: scale the whole page so px and rem sizes grow together */
:root[data-font="l"] body{zoom:1.15}
:root[data-font="xl"] body{zoom:1.3}
/* the header keeps its normal size so the month switcher and settings button always fit */
:root[data-font="l"] header.top{zoom:.8696}
:root[data-font="xl"] header.top{zoom:.7692}
.pats{display:grid;gap:6px;margin-bottom:12px}
.pat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.pat .num{font-weight:700;font-size:1.05rem}
.pat .pj{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.brkbox{display:grid;gap:6px}
.brkrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;white-space:nowrap}
.brkrow input[type=text]{width:3.4em;flex:0 0 auto;text-align:center}
.brkrow button{min-width:36px;min-height:36px;padding:0;margin-left:auto}
.dayform input[type=time]{font-family:var(--font-num);width:7.2em}
.preview{font-family:var(--font-num);font-size:.86rem;background:var(--bg);border-radius:8px;padding:8px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,16px);max-width:min(92vw,460px);z-index:20;
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:.92rem;font-weight:500;
  box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .undo{pointer-events:auto;margin-left:8px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:900;cursor:pointer}
#toast .mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--good);color:var(--surface)}
#toast.warn .mark{background:var(--warn)} #toast.bad .mark{background:var(--bad)}
#toast.saving .mark{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s ease,transform .2s ease}}
.tiles.four{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.tiles.four{grid-template-columns:1fr 1fr}.tiles.four .tile:last-child{grid-column:auto}}
.rankname{font-size:1.5rem;font-weight:900;letter-spacing:.04em}
.bcat{display:flex;flex-direction:column;gap:10px}
.bcat+.bcat{margin-top:8px}
.bcat-h{display:flex;justify-content:space-between;align-items:baseline}
.bcat-h h3{margin:0;font-size:.95rem;font-weight:900}
.bcat-h span{font-size:.78rem;font-weight:700;color:var(--muted);font-family:var(--font-num)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0;background:var(--bg)}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.15rem;color:var(--surface);background:var(--locked);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.badge.on.t1 .medal{background:var(--bronze)} .badge.on.t2 .medal{background:var(--silver)} .badge.on.t3 .medal{background:var(--gold)}
.badge:not(.on) .bt{color:var(--muted)}
.badge.on{background:var(--surface)}
.badge .bt{font-weight:700;font-size:.9rem;line-height:1.35}
.badge .bd{font-size:.74rem;color:var(--muted);line-height:1.4}
.badge .bdate{font-size:.72rem;color:var(--muted);font-family:var(--font-num)}
.badge .meter{width:100%;height:6px}
.savebox{display:flex;flex-direction:column;gap:8px}
.plan{font-size:.92rem;line-height:1.7}
.plan b{font-family:var(--font-num)}
.proj{width:100%;border-collapse:collapse;font-size:.84rem;font-family:var(--font-num)}
.proj th,.proj td{padding:5px 8px;text-align:right;border-top:1px dashed var(--line);white-space:nowrap}
.proj th:first-child,.proj td:first-child{text-align:left}
.proj th{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:.76rem;border-top:none}
.proj td.neg{color:var(--bad)}
#toast.trophy .mark{background:var(--gold)}
/* achievements typography: sharper game-title faces */
.rankcard .rankname{font-family:var(--font-ach);font-size:1.9rem;letter-spacing:.04em}
.emblem{font-family:var(--font-en)}
.emblem .lv{font-size:.72rem;letter-spacing:.08em}
.gotcount{font-family:var(--font-en)}
.rk-k{font-family:var(--font-en);letter-spacing:.14em;font-size:.68rem}
.badge .bt{font-family:var(--font-ach);font-weight:400;font-size:1.02rem;letter-spacing:.02em}
.badge .btier{font-family:var(--font-en);font-size:.62rem;letter-spacing:.16em}
.badge .bdate{font-family:var(--font-en);letter-spacing:.04em}
.bcat-h h3{font-family:var(--font-ach);font-weight:400;font-size:1.15rem;letter-spacing:.04em}
.cel-en{font-family:var(--font-en);font-size:.72rem;letter-spacing:.22em;color:var(--muted)}
.cel-kicker{font-family:var(--font-ach);font-size:2rem;letter-spacing:.06em;text-shadow:3px 3px 0 var(--tint)}
.cel-title{font-family:var(--font-ach);font-size:1.6rem;letter-spacing:.03em}
.cel-tier{font-family:var(--font-en);font-size:.72rem;letter-spacing:.18em}
.cel-actions .primary{font-family:var(--font-ach);font-size:1.15rem;letter-spacing:.06em}
/* legend tier */
.badge.on.t4{background:#1D2A24;color:#F4F1FF;border-color:#1D2A24;box-shadow:3px 3px 0 #B69CFF}
.badge.on.t4 .bd,.badge.on.t4 .bdate{color:#CFC6EA}
.badge.on.t4 .btier{background:linear-gradient(90deg,#7DE2D1,#B69CFF,#FF9EC7,#FFD66B);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge.t4:not(.on){border-style:dashed}
.legendcat{background:linear-gradient(135deg,color-mix(in srgb,#B69CFF 14%,transparent),transparent 60%);border-radius:16px;padding:10px}
.legendcat .bcat-h h3{background:linear-gradient(90deg,#3FB9A6,#8C6CF0,#E5639E,#D9A21B);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge .meter.mini{display:block;padding:0;height:6px;border-radius:99px;background:var(--tint);gap:0;min-width:0}
.badge.t4 .meter.mini{background:color-mix(in srgb,#B69CFF 20%,var(--surface))}
.cel-tier.t4{background:linear-gradient(90deg,#3FB9A6,#8C6CF0,#E5639E,#D9A21B)}
.cel-card.t4{background:#1D2A24;color:#F4F1FF;box-shadow:6px 6px 0 #B69CFF}
.cel-card.t4 .cel-kicker{color:#FFD66B;text-shadow:3px 3px 0 #8C6CF0}
.cel-card.t4 .cel-desc,.cel-card.t4 .cel-en{color:#CFC6EA}
.cel-card.t4 .cel-rays{opacity:.55;background:repeating-conic-gradient(#7DE2D1 0 8deg,transparent 8deg 16deg,#FF9EC7 16deg 24deg,transparent 24deg 32deg)}
@media (prefers-reduced-motion:no-preference){.medalsvg.legend.on{animation:legendglow 2.4s ease-in-out infinite}@keyframes legendglow{0%,100%{filter:drop-shadow(0 0 0 rgba(182,156,255,0))}50%{filter:drop-shadow(0 0 8px rgba(182,156,255,.9))}}}
.brand{font-family:var(--font-pop);font-weight:400;font-size:1.45rem;color:var(--accent);letter-spacing:.02em}
body.in-onb #appHeader, body.in-onb nav.tabs{display:none}
.onb{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.odots{display:flex;gap:6px;justify-content:center}
.odot{width:28px;height:6px;border-radius:99px;background:var(--line)}
.odot.done{background:var(--accent)} .odot.cur{background:var(--pop)}
.ostep{display:flex;flex-direction:column;gap:14px}
.ostep-h{display:flex;flex-direction:column;gap:6px}
.cycbox{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.cyck{display:flex;align-items:center;gap:6px}.cycx{min-height:28px!important;padding:0 8px!important}.cycadd{color:var(--accent);font-weight:900}
.cycrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;background:var(--bg);border-radius:12px;padding:10px}
.cycrow .cyck{grid-column:1 / -1;font-size:.74rem;font-weight:900;color:var(--accent)}
.cycrow select{width:100%}
.cycfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.cycfoot .ghost{color:var(--accent);font-weight:900}
.goalform{display:flex;flex-direction:column;gap:10px}
.goalbtns{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}

<script>
(() => {
"use strict";
const CAL = "Google Calendar";
const JST = 9 * 3600e3;
const JP = new Intl.NumberFormat("ja-JP");
const yen = n => (Math.round(n || 0) < 0 ? "−¥" : "¥") + JP.format(Math.abs(Math.round(n || 0)));
/* 8.1666… hours → "8時間10分" */
const dur = h => { const m = Math.round((h || 0) * 60), H = Math.floor(m / 60), M = m % 60; return H && M ? `${H}時間${M}分` : H ? `${H}時間` : `${M}分`; };
const hrs = n => (Math.round((n || 0) * 100) / 100).toString();
const pad = n => String(n).padStart(2, "0");
const toHalf = v => String(v ?? "").replace(/[０-９．－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，、円¥￥\s]/g, "");
const num = v => { const x = parseFloat(toHalf(v)); return isFinite(x) ? x : 0; };
const badNum = v => toHalf(v) !== "" && !isFinite(parseFloat(toHalf(v)));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW = ["日","月","火","水","木","金","土"];

function jp(d){ const x = new Date(d.getTime() + JST); return {y:x.getUTCFullYear(), m:x.getUTCMonth()+1, d:x.getUTCDate(), dow:x.getUTCDay(), h:x.getUTCHours(), mi:x.getUTCMinutes()}; }
function jd(y,m,d,h=0,mi=0){ return new Date(Date.UTC(y,m-1,d,h,mi) - JST); }
function isoJ(d){ const p = jp(d); return `${p.y}-${pad(p.m)}-${pad(p.d)}T${pad(p.h)}:${pad(p.mi)}:00+09:00`; }
function hm(d){ const p = jp(d); return `${p.h}:${pad(p.mi)}`; }

/* ---------- defaults ---------- */
const DEFAULTS = {
  onboarded: false,
  calMode: "",
  jobs: [],
  eventColors: "4",
  ignoreTitles: "",
  calSync: false,
  recurring: [],
  fixedItems: [],
  fixedCost: 0,
  saving: 0,
  persona: "student",   // student | part | worker
  walls: null,          // ids from WALLS; null = not chosen yet (filled from persona on load)
  wallCustom: "",
  wall: 1500000,        // legacy single wall, migrated to wallCustom
  otherIncome: 0,
  monthStart: 1,        // 月の区切り: a "month" runs from this day to the day before it next month
  rateJob: ""
};
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
const now = jp(new Date());
const S = {
  tab: "home",

  if (a && b){
    s = jd(y, m, d, a[0], a[1]); e = jd(y, m, d, b[0], b[1]);
    if (e <= s) e = new Date(e.getTime() + 864e5);   // ends after midnight
    span = (e - s) / 36e5;
  }
  const brk = Math.min(span, num(r.breakMin) / 60);
  const paid = Math.max(0, span - brk);
  if (s && job && job.night) night = Math.min(paid, nightHours(s, e));
  const weekend = ev.dow === 0 || ev.dow === 6;
  let pay = 0, avgRate = 0;
  const used = new Set();
  if (job){
    if (job.payType === "fixed"){ const r = rateFor(valAt(job, "fixedPay", ev.ymd), rulesOf(job), ev, null); r.hit.forEach(h => used.add(h)); pay = r.v; }
    else if (job.payType === "salary") pay = valAt(job, "salary", ev.ymd) / Math.max(1, num(job.stdHours) || 160) * 1.25 * Math.max(0, paid - (hasVal(job.dayHours) ? num(job.dayHours) : 8));
    else {
      const rules = rulesOf(job), base = valAt(job, "wage", ev.ymd);
      if (rules.length && s && span > 0){
        // minute by minute: the rate in force at each minute; 深夜割増 is 25% of whatever rate applies then
        let sum = 0, nsum = 0, nmin = 0, n = 0;
        for (let t = s.getTime(); t < e.getTime(); t += 60000){
          const p = jp(new Date(t)), r = rateFor(base, rules, ev, p.h * 60 + p.mi);
          sum += r.v; n++; r.hit.forEach(h => used.add(h));
          if (p.h >= 22 || p.h < 5){ nsum += r.v; nmin++; }
        }
        avgRate = sum / n;
        pay = avgRate * paid + (nmin ? nsum / nmin : avgRate) * 0.25 * night;
      } else if (rules.length){
        const r = rateFor(base, rules, ev, null); r.hit.forEach(h => used.add(h)); avgRate = r.v;
        pay = avgRate * paid + avgRate * 0.25 * night;
      } else pay = base * paid + base * 0.25 * night + (weekend && num(job.weekendExtra) ? num(job.weekendExtra) * paid : 0);
    }
    pay = Math.floor(pay);
  }
  const hasTr = r.transport !== undefined && r.transport !== null && r.transport !== "";
  const transport = job && job.payType !== "salary" ? (hasTr ? num(r.transport) : num(job.transport)) : 0;   // 月給: 通勤手当 is monthly
  let alwPay = 0, alwTr = 0;
  const alwHit = [];
  if (job && job.payType !== "salary") for (const al of alwOf(job)) if (al.scope === "shift" && alwMet(al, 1, paid)){ if (al.isTr) alwTr += num(al.amount); else alwPay += num(al.amount); alwHit.push(al); }
  pay += alwPay;
  const wagePay = pay;
  pay += transport + alwTr;
  const rateLabel = job && job.payType === "fixed" ? "1回の金額が未設定" : job && job.payType === "salary" ? "月給が未設定" : "時給が未設定";
  const needsRate = !job ? false : job.payType === "fixed" ? !num(job.fixedPay) : job.payType === "salary" ? !num(job.salary) : !num(job.wage);
  const ot = job && job.payType === "salary" ? Math.max(0, paid - (hasVal(job.dayHours) ? num(job.dayHours) : 8)) : 0;
  const rateNote = used.size ? [...used].map(h => `${ruleLabel(h)} ${h.mode === "add" ? "+" + yen(num(h.amount)) : yen(num(h.amount))}`).join("・") : "";
  return {id, rec: r, ev, job, span, brk, paid, night, weekend, ot, rateNote, avgRate, pay, rawPay: pay, wagePay, transport: transport + alwTr, alwHit, excluded: false, needsRate,
          rateLabel, pd: job ? payday(ev, job) : {y, m, d, key: ""}, time: a && b ? `${r.start}–${r.end}` : ""};
}

function findExisting(r, job){

function calTimes(r){
  const [y, m, d] = r.ymd.split("-").map(Number);
  const a = parseHM(r.start), b = parseHM(r.end);
  if (a && b){
    const st = jd(y, m, d, a[0], a[1]); let en = jd(y, m, d, b[0], b[1]);

const SYNC_MSG = {

function setShiftMeta(id, patch){

async function syncShift(id, quiet){
  const r = S.shifts[id]; if (!r || !mcp || syncing.has(id)) return false;
  const job = jobById(r.job); if (!job) return false;
  syncing.add(id); render();
  const c = calcShift(r, job, id), t = calTimes(r);
  let evId = r.calEventId || "", adopted = !!r.calAdopted;
  try {
    if (!evId){ const ex = findExisting(r, job); if (ex){ evId = ex.id; adopted = true; } }
    if (evId){
      const upd = {eventId: evId, calendarId: CAL_ID, startTime: t.startTime, endTime: t.endTime, description: calDesc(c), notificationLevel: "NONE"};
      if (t.allDay) upd.allDay = true;
      if (!adopted){ upd.summary = job.name; upd.colorId = String(job.calColor || "6"); }
      try { await mcp.callTool(CAL, "update_event", upd, {cache: false}); }
      catch(e){
        if (e && e.code === "tool_error"){ evId = ""; adopted = false; }   // the event was deleted in Google Calendar: create it again
        else throw e;
      }
    }
    if (!evId){
      const res = await mcp.callTool(CAL, "create_event", {calendarId: CAL_ID, summary: job.name, colorId: String(job.calColor || "6"),
        description: calDesc(c), startTime: t.startTime, endTime: t.endTime, allDay: t.allDay, timeZone: "Asia/Tokyo", notificationLevel: "NONE"}, {cache: false});
      evId = extractId(res && res.payload);
      if (!evId) throw {code: "no_id", message: "作成した予定のIDを受け取れませんでした"};
    }
    syncing.delete(id);
    setShiftMeta(id, {calEventId: evId, calAdopted: adopted, calSync: "ok", calSyncedAt: new Date().toISOString()});
    if (!quiet) addNotice("", adopted ? "保存しました。カレンダーの同じ日の予定を、入力した時刻に合わせました" : "保存しました。Google カレンダーにも登録しました");
    return true;
  } catch(e){
    syncing.delete(id);
    // A timeout is ambiguous for a write: keep any id we have and let the viewer retry by hand.
    setShiftMeta(id, {calEventId: evId || r.calEventId || "", calAdopted: adopted, calSync: "error"});
    if (!quiet) addNotice("bad", (e && SYNC_MSG[e.code]) || `カレンダーに反映できませんでした（${esc((e && (e.code || e.message)) || "不明")}）。シフトの「反映」を押して再度お試しください。`);
    return false;
  }
}
async function unsyncShift(r){

  catch(e){ if (!(e && e.code === "tool_error")) addNotice("bad", (e && SYNC_MSG[e.code]) || "カレンダーの予定を消せませんでした。Google カレンダーで直接削除してください。"); }
}

      const a = bizAdjust(by, bm, Math.min(Math.max(1, num(r.day) || 1), blast), r.holidayShift || "next");

function summary(y, m){
  const key = `${y}-${pad(m)}`;
  const shifts = allShifts();
  const mi = budgetIncome(y, m, shifts);
  const payIn = mi.payIn;
  const income = mi.total;
  const byJob = {};
  for (const s of payIn){ const b = byJob[s.job.id] || (byJob[s.job.id] = {job: s.job, n:0, hours:0, pay:0, tr:0, pd:s.pd}); b.n++; b.hours += s.excluded ? 0 : s.paid; b.pay += s.pay; b.tr += s.transport; }
  const trIn = mi.estTr;
  const evs = eventList(y, m);
  const evTotal = evs.reduce((a, e) => a + evCost(e.doc), 0) - cardOverlap(evs), spent = evs.filter(isSpent).reduce((a, e) => a + evCost(e.doc), 0);
  const fixed = num(S.settings.fixedCost), save = savingFor(y, m), wish = wishMonthTotal(key);
  const free = income - fixed - save - wish;
  const left = free - evTotal;
  let yearTr = 0, yearSum = 0, yearWh = 0, yearOtsu = 0, yearIns = 0;
  // 年収 = pay that actually arrives Jan 1 – Dec 31 (periods can straddle the new year), plus other income that is 所得
  for (let i = 0; i <= 12; i++){
    const [py, pm] = addMonths(y, 0, i), r = monthIncome(py, pm, shifts);
    for (const row of r.rows) if (row.pd.y === y){ yearSum += row.used + row.wh + row.ins; yearWh += row.wh; yearIns += row.ins; if (!row.confirmed) yearTr += row.tr; if (isOtsu(row.job)) yearOtsu += row.used + row.wh + row.ins - (row.confirmed ? 0 : row.tr); }
    if (py === y) yearSum += r.othersWork;
  }
  const yearPay = yearSum - yearTr + num(S.settings.otherIncome), yearPayAll = yearSum + num(S.settings.otherIncome);
  const missingRate = payIn.some(s => s.needsRate && !s.excluded && !mi.rows.find(r => r.job.id === s.job.id).confirmed);
  const worked = shifts.filter(s => inPeriod(s.ev.ymd, y, m));
  const workedPay = worked.reduce((a, s) => a + s.pay, 0);
  const pds = [...new Set(worked.map(s => `${s.pd.m}/${s.pd.d}`))];
  const workedPd = pds.length === 1 ? `${pds[0]}支給` : pds.length ? `${pds.join("・")}支給` : "";
  return {key, mi, payIn, income, trIn, spent, yearTr, yearWh, yearOtsu, yearIns, workedPay, workedPd, byJob, evs, evTotal, fixed, save, wish, free, left, yearPay, yearPayAll, missingRate};
}

function nextPayday(shifts){
  // earliest pay still to arrive (today or later), looking up to 3 months ahead
  // a payday with no amount yet (shifts for that period not entered) still counts for a job paid the month before,
  // so a regular job's payday is not skipped; one-off jobs (e.g. exam proctoring) only show when they have an amount
  let best = null;
  for (let i = 0; i < 4; i++){
    const [y, m] = addMonths(Number(todayKey.slice(0, 4)), Number(todayKey.slice(5, 7)), i), [py, pm] = addMonths(y, m, -1), prev = monthIncome(py, pm, shifts).rows;
    for (const r0 of monthIncome(y, m, shifts).rows){
      const r = Object.assign({}, r0, {key: `${y}-${pad(m)}`});   // the period the pay belongs to, for entering its amount
      // かんたんモード: every monthly job is paid every month even before an amount is typed
      const regular = r.freq === "monthly" && (isSimple() || prev.some(q => q.job.id === r.job.id && q.used));
      if (!r.used && !regular) continue;
      const ymd = `${r.pd.y}-${pad(r.pd.m)}-${pad(r.pd.d)}`;
      if (ymd < todayYmd) continue;
      if (!best || ymd < best.ymd) best = {ymd, rows: [r]};
      else if (ymd === best.ymd) best.rows.push(r);
    }
    if (best) break;
  }
  return best;
}

/* the 社会保険の扶養 walls: what crossing them costs in take-home pay */
const FUYO_OF = [["parent", "親など家族"], ["spouse", "配偶者（会社員・公務員）"], ["none", "入っていない"]];
const fuyoOfEff = () => S.settings.fuyoOf || (personaOf() === "student" ? "parent" : "");
function wallImpact(w, v){
  if (!/^shaho/.test(w.id) || v < w.amount * 0.8) return "";
  if (S.settings.jobs.some(j => j.shaho)) return `<div class="impact small">勤め先の社会保険に入っているので、この壁は関係ありません（保険料はすでに給料から引いて計算しています）。</div>`;
  const who = fuyoOfEff(), nen = KOKUNEN_M * 12, monthly = Math.round(w.amount / 12);
  // which costs start depends on whose 扶養: a spouse's (第3号 → 国民年金 too) or a parent's (20歳以上は国民年金をもともと払う)
  if (!who) return `<div class="impact small"><b>超えると手取りが減ります。誰の扶養に入っていますか？</b>
    <div class="dayform">${FUYO_OF.map(([v, n]) => `<button type="button" class="ghost small-btn" data-act="fuyoof" data-v="${v}">${n}</button>`).join("")}</div>
    <span>配偶者の扶養なら国民年金と国民健康保険、親の扶養なら国民健康保険を自分で払うことになります。</span></div>`;
  if (who === "none") return "";
  const spouse = who === "spouse";
  return `<div class="impact small"><b>超えると手取りが減ります</b>
    ${spouse ? `配偶者の扶養から外れ、自分で<b>国民年金 月${yen(KOKUNEN_M)}（年${yen(nen)}）</b>と国民健康保険料（市区町村で違います）を払います。年収${yen(w.amount)}のときの手取りに戻るには、少なくとも年収 約${Math.ceil((w.amount + nen) / 10000)}万円以上が必要です（国民健康保険料のぶん、さらに上がります）。`
      : `家族の健康保険から外れ、自分で国民健康保険料（市区町村で違います）を払うことになります。20歳以上なら国民年金はもともと自分で払う（学生は猶予できる）ので、増えるのは健康保険の分です。勤め先の社会保険に入る場合は、給料から約${SHAHO_RATE}%引かれます。`}
    <br>年の合計だけでなく、月 約${yen(monthly)}を超える月が続くと、年の途中でも外れることがあります。</div>`;
}
/* 乙欄で引かれた所得税は、年収が少なければ確定申告（還付申告）でほぼ戻る */
function taxReturnHtml(x, y){
  if (!x.yearWh) return "";
  const gross = x.yearPay, free = gross <= 1780000;
  // 国税庁 No.1900: 年末調整されない給与が20万円超で原則申告。給与の合計−所得控除（基礎控除などを除く）が150万円以下なら不要
  const must = x.yearOtsu > 200000 && gross > 1500000;
  return `<div class="taxret"><b>確定申告で戻るかも：${y}年に乙欄で引かれる所得税 約${yen(x.yearWh)}</b>
    <span class="small">${free ? `${y}年の年収が178万円以下なら所得税はかからないので、${y + 1}年1月以降に確定申告（還付申告）をすると、引かれた分がほぼ戻ります。5年以内なら後からでも申告できます。` : `年収が178万円を超えると所得税がかかるので、戻るのは一部か、追加で払うこともあります。`}
    ${must ? `年末調整をしないバイト先の給料が年20万円を超え、年収も150万円を超えるので、確定申告が必要になる見込みです（社会保険料などを払っている場合は変わります）。` : ""}
    必要なもの：各バイト先の源泉徴収票（年末〜1月ごろにもらえます）。金額は目安です。</span></div>`;
}

  if (!p) return `<section class="block savebox">
    <div class="small muted">今の口座残高と、いつまでにいくら貯めたいかを入れると、毎月貯めるべき額と自由に使えるお金を計算します。</div>${inputs}</section>`;

  const rest = g && t.startsWith(g) ? t.slice(g.length).replace(/^[\s：:・\-—]+/, "") : t;
  return rest || t;
}
/* ---------- income sheet: type the pay for months without shifts ----------
   mode "budget": the pay that funds the viewed month; "work": the pay for work done in the viewed month; "pay": the next payday */
function incRowsFor(mode){
  const shifts = allShifts();
  if (mode === "pay"){
    const np = nextPayday(shifts); if (!np) return [];
    return np.rows.map(r => ({jobId: r.job.id, key: r.key, name: r.job.name, sub: `${md(np.ymd)}振込`, est: r.est, conf: r.confirmed ? r.conf : ""}));
  }
  if (mode === "work"){
    const pr = periodRange(S.y, S.m), [y, m, d] = pr.start.split("-").map(Number);
    return S.settings.jobs.filter(j => freqOf(j) === "monthly").map(j => {
      const pd = payday({y, m, d}, j), mi = monthIncome(...pd.key.split("-").map(Number), shifts), r = mi.rows.find(x => x.job.id === j.id);
      return {jobId: j.id, key: pd.key, name: j.name, sub: `${mName()}に働いた分 ・ ${pd.m}/${pd.d}振込`, est: r ? r.est : 0, conf: r && r.confirmed ? r.conf : ""};
    });
  }
  return budgetIncome(S.y, S.m, shifts).rows.map(r => ({jobId: r.job.id, key: r.srcKey, name: r.job.name, sub: `${r.pd.m}/${r.pd.d}振込`, est: r.est, conf: r.confirmed ? r.conf : ""}));
}

const wishes = () => Array.isArray(S.settings.wishes) ? S.settings.wishes : [];
const wishActive = () => wishes().filter(w => !w.done);
/* 毎月取り分ける: w.auto + w.monthly from period w.autoFrom; each month that has begun counts as saved */
const monthsFrom = (a, b) => (Number(b.slice(0, 4)) - Number(a.slice(0, 4))) * 12 + Number(b.slice(5, 7)) - Number(a.slice(5, 7)) + 1;
/* a month's set-aside is counted once that month's pay is entered (shifts or an amount) */
const payInKey = k => { const mi = budgetIncome(Number(k.slice(0, 4)), Number(k.slice(5, 7))); return mi.total > 0 || mi.rows.some(r => r.confirmed); };
function wishSaved(w, upto){
  let v = num(w.saved);
  if (w.auto && w.autoFrom && num(w.monthly) && !w.done)
    for (let k = w.autoFrom, n = 0; k <= (upto || todayKey) && n < 240; k = keyAdd(k, 1), n++) if (payInKey(k)) v += num(w.monthly);
  return num(w.price) ? Math.min(v, num(w.price)) : v;
}
function wishDeduct(w, key){
  if (!w.auto || w.done || !num(w.monthly) || !w.autoFrom || key < w.autoFrom) return 0;
  return Math.max(0, Math.min(num(w.monthly), num(w.price) - wishSaved(w, keyAdd(key, -1))));
}
const wishMonthTotal = key => wishes().reduce((a, w) => a + wishDeduct(w, key), 0);
/* before the auto amount changes or stops: keep what past months already set aside, restart from this month */
function foldWish(w){
  const done = w.auto && w.autoFrom ? wishSaved(w, keyAdd(todayKey, -1)) : num(w.saved);
  return Object.assign({}, w, {saved: done, autoFrom: w.auto ? todayKey : ""});
}
function wishSuggest(w){
  const left = Math.max(0, num(w.price) - wishSaved(w));
  if (w.due && /^\d{4}-\d{2}$/.test(w.due)) return Math.ceil(left / Math.max(1, monthsFrom(todayKey, w.due)) / 100) * 100;
  return Math.max(1000, Math.ceil(left / 12 / 1000) * 1000);
}
/* what one hour (and one shift) of the viewer's own work is worth, from recent shifts; falls back to the hourly wage */
function workRate(){
  const from = keyAdd(todayKey, -3);
  const done = allShifts().filter(t => t.ev.ymd <= todayYmd && t.ev.ymd.slice(0, 7) >= from && t.paid > 0 && t.job.payType !== "salary");
  const h = done.reduce((a, t) => a + t.paid, 0);
  if (h >= 4) return {perH: done.reduce((a, t) => a + t.pay - t.transport, 0) / h, perShift: h / done.length};
  const rj = rateJob(); return rj ? {perH: num(rj.wage), perShift: 0} : null;
}
function wishInfo(w){
  const price = num(w.price), saved = wishSaved(w), left = Math.max(0, price - saved);
  const r = workRate(), hours = r && r.perH > 0 ? left / r.perH : 0;
  const out = {price, saved, left, pct: price ? Math.min(100, saved / price * 100) : 0, hours, shifts: r && r.perShift ? Math.ceil(hours / r.perShift) : 0};
  if (w.due && /^\d{4}-\d{2}$/.test(w.due)){
    const months = (Number(w.due.slice(0, 4)) - now.y) * 12 + Number(w.due.slice(5)) - now.m + 1;
    out.months = Math.max(1, months); out.late = months < 1;
    out.perMonth = Math.ceil(left / out.months / 100) * 100;
    out.hoursMonth = r && r.perH > 0 ? out.perMonth / r.perH : 0;
  }
  // earning the rest this year on top of the usual pace could cross the next "wall"
  const x = summary(...todayKey.split("-").map(Number)), wl = wallList().find(v => wallVal(v, x) < v.amount);
  if (wl && left && (!w.due || w.due.slice(0, 4) === String(now.y)) && left > wl.amount - wallVal(wl, x)) out.wall = wl;
  return out;
}
const wishHoursText = i => i.hours ? `あと約${Math.ceil(i.hours)}時間${i.shifts ? `（シフト約${i.shifts}回）` : ""}` : "";

function wishOffer(){
  const w = wishActive().find(v => num(v.price) > num(v.saved)); if (!w) return null;

/* ---------- events ---------- */
function setMonth(dm){
  let m = S.m + dm, y = S.y; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; }
  S.y = y; S.m = m;
  S.sel = null; S.evEdit = null; S.incEdit = null; if (S.calYear !== y && mcp) fetchCalendar(y, false); else render();
}
document.getElementById("prevM").onclick = () => setMonth(-1);
document.getElementById("nextM").onclick = () => setMonth(1);
document.querySelector("nav.tabs").addEventListener("click", e => {

  S.tab = b.dataset.tab; try { history.replaceState(null, "", "#" + S.tab); } catch(_){}
  render();
});

    const title = doc.title || (recItem && recItem.title) || (S.cal.find(v => v.id === id) || {}).title || "行事";
    S.evEdit = null;

  else if (act === "clearInc"){ const k = a.dataset.key || `${S.y}-${pad(S.m)}`, d = clone(S.income[k] || {}); d.jobs = d.jobs || {}; delete d.jobs[id]; putDoc("income", k, d, "確定額を取り消しました。シフトの見込みに戻します"); }

  else if (act === "quickIncome"){ document.getElementById("sheet").hidden = true; S.tab = "home"; [S.y, S.m] = refreshToday(); openIncEditor("budget"); }

  else if (act === "quickShift" || act === "quickEvent"){

    if (act === "quickShift"){ S.tab = "shifts"; S.sel = todayYmd; if (S.form && S.form.editId) S.form = null; }
    else { S.tab = "events"; S.evView = ""; S.evDraft = {group: ""}; render(); openEvEditor(null); return; }

    const el = document.getElementById("fStart");
    if (el){ el.scrollIntoView({block: "center"}); el.focus(); }

  else if (act === "tutorial"){ S.tab = "home"; [S.y, S.m] = refreshToday(); S.tut = 0; render(); }

  else if (act === "rwCancel"){ S.rewardEdit = null; render(); }

  else if (act === "backupLater"){ const d = new Date(Date.UTC(now.y, now.m - 1, now.d + 14)); S.settings.backupSnooze = d.toISOString().slice(0, 10); persist(); render(); toast("2週間後にもう一度お知らせします"); }
  else if (act === "importOk"){ applyImport(); }
  else if (false){
    const d = null; if (!d) return;
    S.settings = Object.assign(clone(DEFAULTS), d.settings || {}); S.shifts = d.shifts || {}; S.events = d.events || {}; S.income = d.income || {}; S.ach = d.ach || {};
    migrateWalls(); migrateRates(); [S.y, S.m] = refreshToday(); saveLocal(); render(); toast("バックアップを読み込みました");
  }

  else if (act === "gofix"){ S.tab = "settings"; S.setTab = "spend"; render(); window.scrollTo(0, 0); }

document.addEventListener("change", e => {
  const t = e.target;
  const val = t.type === "checkbox" ? t.checked : t.value;
  if (t.dataset.form){
    if (t.dataset.form === "job" && S.form && !S.form.editId){ S.form = formFor(val); render(); }
    else if (t.dataset.form === "job"){ S.form.job = val; render(); }
    return;
  }
  if ((t.dataset.ev || t.dataset.set) && t.type !== "checkbox" && t.tagName !== "SELECT" && t.getAttribute("inputmode") === "decimal" && badNum(val)){
    toast("数字で入力してください", "warn"); return;
  }
  if (t.dataset.incJob !== undefined || t.dataset.incOther !== undefined){
    const k = t.dataset.incKey || `${S.y}-${pad(S.m)}`, d = clone(S.income[k] || {});
    if (t.dataset.incJob !== undefined){
      if (badNum(val)){ toast("数字で入力してください", "warn"); return; }
      d.jobs = d.jobs || {};
      const j = jobById(t.dataset.incJob);
      if (val === "") delete d.jobs[t.dataset.incJob]; else d.jobs[t.dataset.incJob] = num(val);
      putDoc("income", k, d, val === "" ? "確定額を空にしました" : `${Number(k.slice(5))}月振込の${esc(j ? j.name : "")}を ${yen(num(val))} で確定しました`);
    } else {
      const i = Number(t.dataset.incOther), f = t.dataset.field; d.others = d.others || [];
      if (!d.others[i]) return;
      if (f === "amount" && badNum(val)){ toast("数字で入力してください", "warn"); return; }
      d.others[i][f] = f === "amount" ? (val === "" ? "" : num(val)) : String(val).trim();
      putDoc("income", k, d, `${mName()}の収入を保存しました`);
    }
    return;
  }
  if (t.dataset.ev){
    const id = t.dataset.ev, cur = Object.assign({}, S.events[id] || {});
    const ev = S.cal.find(v => v.id === id);
    if (ev && !cur.manual){ cur.title = ev.title; cur.ymd = ev.ymd; }
    if (id.startsWith("rc_")){ const it = eventList(S.y, S.m).find(e => e.id === id); if (it){ cur.title = it.title; cur.ymd = it.ymd; cur.recurring = true; } }
    const fld = t.dataset.field;
    if (["budget","actual"].includes(fld) && badNum(val)){ toast("数字で入力してください", "warn"); return; }
    if (fld === "title" && !String(val).trim()){ toast("行事名を入れてください", "warn"); return; }
    if (fld === "ymd" && !val) return;
    cur[fld] = ["memo","title","ymd","group"].includes(fld) ? (fld === "title" || fld === "group" ? String(val).trim() : val) : (val === "" ? "" : num(val));
    if (fld === "ymd" && !inPeriod(val, S.y, S.m)){ putDoc("events", id, cur, `「${esc(cur.title)}」を${Number(val.slice(5,7))}月${Number(val.slice(8))}日に移しました`); return; }
    putDoc("events", id, cur, `「${esc(cur.title || "行事")}」を保存しました`);
  } else if (t.dataset.job){
    const j = S.settings.jobs[Number(t.dataset.job)], f = t.dataset.field;
    if (t.type !== "checkbox" && t.tagName !== "SELECT"){ clearTimeout(typingTimer); if (f !== "name" && f !== "since" && badNum(val)) return; }
    j[f] = (t.type === "checkbox" || ["name","payType","calColor","holidayShift","since","fuyo"].includes(f)) ? val : num(val);
    if (f === "payType" && val === "salary") toSalary(j);
    if (f === PAY_FIELD.hourly || f === PAY_FIELD.fixed || f === PAY_FIELD.salary){ editTodayAmount(j, f); S.jobAmtTyped = true; }
    putSettings(`「${esc(j.name)}」を保存しました`);
  } else if (t.dataset.fix !== undefined){
    const f = (S.settings.fixedItems || [])[Number(t.dataset.fix)], fld = t.dataset.field; if (!f) return;
    if (fld === "amount" && badNum(val)){ toast("数字で入力してください", "warn"); return; }
    f[fld] = fld === "card" ? !!val : fld === "amount" || fld === "day" ? (val === "" ? "" : num(val)) : String(val).trim();
    S.settings.fixedCost = fixTotal();
    putSettings(`「${esc(f.name || "固定費")}」を保存しました`);
  } else if (t.dataset.rec !== undefined){
    const r = (S.settings.recurring || [])[Number(t.dataset.rec)], f = t.dataset.field; if (!r) return;
    if (!["title","holidayShift"].includes(f) && badNum(val)){ toast("数字で入力してください", "warn"); return; }
    r[f] = f === "title" ? String(val).trim() : f === "holidayShift" ? val : (val === "" ? "" : num(val));
    if (f === "day") r.day = Math.min(31, Math.max(1, num(val) || 1));
    putSettings(`「${esc(r.title || "毎月の行事")}」を保存しました`);
  } else if (t.dataset.set){
    const f = t.dataset.set;
    if (["balance","goalAmount","assumeIncome"].includes(f) && badNum(val)){ toast("数字で入力してください", "warn"); return; }
    S.settings[f] = t.type === "checkbox" ? val : ["eventColors","rateJob","ignoreTitles","goalMonth","persona","fontSize","fuyoOf"].includes(f) ? val : (["balance","goalAmount","assumeIncome","wallCustom"].includes(f) && val === "" ? "" : num(val));
    if (f === "persona"){ S.settings.walls = WALL_DEF[val].slice(); putSettings("年収の壁を" + PERSONAS.find(p => p[0] === val)[1] + "向けにしました"); return; }
    if (f === "balance") S.settings.balanceDate = todayYmd;
    if (f === "monthStart"){
      // pay that arrives at the start of a period is usually spent in that same period
      S.settings.jobs.forEach(j => { if (freqOf(j) === "monthly") j.useLag = S.settings.monthStart > 1 ? 0 : 1; });
      [S.y, S.m] = refreshToday(); S.sel = null;
      putSettings(S.settings.monthStart > 1 ? `1か月を${S.settings.monthStart}日〜翌月${S.settings.monthStart - 1}日にしました。給料は「振り込まれた月」に使う設定に切り替えています` : "1か月を1日〜末日に戻しました");
      return;
    }
    putSettings("設定を保存しました");
  }
});

document.addEventListener("submit", e => {

      ${cta("保存してつぎへ", true)}`;

    const items = st.fixedItems || (st.fixedItems = []);
    const card = (st.recurring || []).find(r => r.id === "card");
    body = `<div class="ostep-h"><h2 class="oh">毎月かならず<br>出ていくお金は？</h2><p class="osub">タップで追加して、自分の金額を入れてください。</p></div>
      <div class="chips">${FIX_PRESETS.map(([n, a]) => `<button type="button" class="pchip ${items.some(f => f.name === n) ? "on" : ""}" data-onb="preset" data-name="${n}" data-amount="${a}" aria-pressed="${items.some(f => f.name === n)}">${items.some(f => f.name === n) ? "✓ " : "＋ "}${n}</button>`).join("")}</div>
      ${items.length ? `<div class="ocard"><div class="fixlist">${items.map((f, i) => `<div class="fixrow">
          <input type="text" id="of-n-${i}" data-o="fixedItems.${i}.name" value="${esc(f.name)}" placeholder="名前" aria-label="名前">
          <input type="text" inputmode="decimal" id="of-a-${i}" data-o="fixedItems.${i}.amount" value="${esc(f.amount)}" placeholder="${f.hint ? `例：${f.hint}` : "円"}" aria-label="金額">
          <button type="button" class="ghost" data-onb="delfix" data-i="${i}" aria-label="${esc(f.name || "固定費")}を削除">×</button>
          <label class="inline fixcard"><input type="checkbox" id="of-c-${i}" data-o="fixedItems.${i}.card" ${f.card ? "checked" : ""}> カード払い</label></div>`).join("")}</div></div>` : ""}
      <button type="button" class="ghost" style="align-self:flex-start;color:var(--accent);font-weight:900" data-onb="addfix">＋ ほかの固定費</button>
      <div class="opreview">固定費の合計 <b id="onbFix">${yen(fixTotal())}</b> / 月</div>
      <label class="choice ${card ? "sel" : ""}"><input type="checkbox" data-onb-card="1" ${card ? "checked" : ""}><span class="ct">クレジットカードの引き落としも管理する</span><span class="cd">毎月の引き落とし日に出費として入ります。金額は毎月入力します。</span></label>
      ${card ? `<div class="grid2"><label class="f">引き落とし日<select id="oc-d" data-o="card.day">${Array.from({length: 28}, (_, i) => i + 1).map(v => `<option value="${v}" ${num(card.day) === v ? "selected" : ""}>${v}日</option>`).join("")}</select></label>
        <label class="f">土日祝のとき<select id="oc-h" data-o="card.holidayShift">${SHIFT_OPTS.map(([v, n]) => `<option value="${v}" ${(card.holidayShift || "next") === v ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>` : ""}
      ${cta("つぎへ")}`;
  }
  if (step === 4){
    const p = savingPlan(), jobs = st.jobs.filter(j => j.name);
    body = `<div class="ohero">
      <div class="logo small">準備OK！</div>
      <ul class="osum">
        <li><span>${jobWord()}</span><b>${jobs.length ? jobs.map(j => esc(j.name)).join("、") : "あとで登録"}</b></li>
        <li><span>貯金</span><b>${p ? `毎月 ${yen(p.perMonth)}（${Number(p.gm.slice(5))}月までに ${yen(p.goal)}）` : "あとで設定"}</b></li>
        <li><span>固定費</span><b>${yen(fixTotal())} / 月</b></li>
      </ul>
      <p class="small muted">${isSimple() ? "まずはホームの「働いた分の見込み」に、シフトボードなどに出ている今月の見込みを入れてみましょう。" : "まずは下の「＋」から、働いた日のシフトを入れてみましょう。"}</p>
    </div>${cta("シフポケをはじめる")}`;
  }
  return `<div class="onb">${top}<div class="ostep">${body}</div></div>`;
}
/* onboarding: which day the household "month" starts — suggested from the payday just entered */
function onbMonthStart(){
  const st = S.settings, D = startDay();
  const pj = st.jobs.find(j => freqOf(j) === "monthly" && num(j.payDay) >= 2 && num(j.payDay) <= 28);
  const pd = pj ? num(pj.payDay) : 25;
  const custom = S.onbMs || (D !== 1 && D !== pd);
  return `<div class="ocard">
    <div class="ocard-h"><b>家計の「1か月」はいつから？</b></div>
    <p class="small muted" style="margin:0">給料日から次の給料日の前日までを1か月にすると、「今月使えるお金」が実際のお財布に近くなります。あとで設定から変えられます。</p>
    <div class="opay">
      <button type="button" data-onb="mstart" data-v="1" aria-pressed="${!custom && D === 1}">1日〜末日（ふつう）</button>
      <button type="button" data-onb="mstart" data-v="${pd}" aria-pressed="${!custom && D === pd}">給料日から（${pd}日〜翌月${pd - 1}日）</button>
      <button type="button" data-onb="mstart" data-v="custom" aria-pressed="${custom}">ほかの日</button>
    </div>
    ${custom ? `<label class="f">1か月の始まりの日<select id="onbMs" data-onb-ms="1">${Array.from({length: 28}, (_, k) => k + 1).map(v => `<option value="${v}" ${D === v ? "selected" : ""}>${v === 1 ? "1日（ふつうの月）" : `${v}日〜翌月${v - 1}日`}</option>`).join("")}</select></label>` : ""}
  </div>`;
}
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset || !t.dataset.onbMs) return;
  e.stopPropagation(); S.settings.monthStart = num(t.value); persist(); render();
}, true);
function setPath(path, val){
  const parts = path.split(".");
  if (parts[0] === "card"){ const c = (S.settings.recurring || []).find(r => r.id === "card"); if (c) c[parts[1]] = parts[1] === "day" ? num(val) : val; return; }
  let o = S.settings;
  for (let i = 0; i < parts.length - 1; i++) o = o[isNaN(parts[i]) ? parts[i] : Number(parts[i])];
  const k = parts[parts.length - 1];
  const numeric = ["wage", "fixedPay", "transport", "amount", "balance", "goalAmount", "salary", "commute"];
  o[k] = numeric.includes(k) ? (val === "" ? "" : num(val)) : ["cutoff", "payOffset", "payDay"].includes(k) ? num(val) : val;
}
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset.o || S.settings.onboarded) return;
  if (t.type === "radio" || t.tagName === "SELECT" || t.type === "checkbox") return;
  if (t.getAttribute("inputmode") === "decimal" && badNum(t.value)){ toast("数字で入力してください", "warn"); return; }
  setPath(t.dataset.o, t.value); persist();
  const g = document.getElementById("onbGoal"); if (g) g.textContent = onbGoalPreview();
  const f = document.getElementById("onbFix"); if (f) f.textContent = yen(fixTotal());
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.onbCard){
    S.settings.recurring = (S.settings.recurring || []).filter(r => r.id !== "card");
    if (t.checked) S.settings.recurring.push({id: "card", title: "クレジットカード引き落とし", day: 10, budget: "", holidayShift: "next"});
    persist(); render(); return;
  }
  if (!t.dataset.o || S.settings.onboarded) return;
  if (t.type === "checkbox"){ setPath(t.dataset.o, t.checked); persist(); render(); return; }
  if (t.type === "radio" || t.tagName === "SELECT" || t.type === "month"){ setPath(t.dataset.o, t.value); persist(); render(); }
}, true);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-onb]"); if (!b) return;
  const a = b.dataset.onb, st = S.settings;
  if (a === "next"){
    if (S.onbStep === 1){
      const nameless = st.jobs.findIndex(j => !String(j.name).trim() && (num(j.wage) || num(j.fixedPay) || num(j.salary)));
      if (nameless >= 0 && !b.classList.contains("skip")){ toast(`${jobWord()}の名前を入れてください`, "warn"); const el = document.getElementById("oj-n-" + nameless); if (el) el.focus(); return; }
      st.jobs = st.jobs.filter(j => String(j.name).trim());
    }
    if (S.onbStep === 2){ if (b.classList.contains("skip")) S.goalDraft = null; else if (goalDirty()) commitGoal(false); }
    if (S.onbStep === 3) st.fixedItems = (st.fixedItems || []).filter(f => String(f.name).trim() || num(f.amount));
    if (S.onbStep >= ONB_STEPS.length - 1){
      // with a payday-based month, each pay is spent in the period it arrives in
      if (startDay() > 1) st.jobs.forEach(j => { if (freqOf(j) === "monthly") j.useLag = 0; });
      [S.y, S.m] = refreshToday();
      st.onboarded = true;
      if (!st.tutorialDone) S.tut = 0; S.tab = "home"; persist(); render(); toast("ようこそ、シフポケへ！"); window.scrollTo(0, 0); return; }
    S.onbStep = (S.onbStep || 0) + 1;
  }
  else if (a === "back") S.onbStep = Math.max(0, (S.onbStep || 0) - 1);
  else if (a === "addjob") st.jobs.push(newJob());
  else if (a === "ptype"){ const j = st.jobs[Number(b.dataset.i)]; j.payType = b.dataset.v; if (j.payType === "salary") toSalary(j); }
  else if (a === "detail"){ const i = b.dataset.i, j = st.jobs[Number(i)]; S.onbDetail = S.onbDetail || {}; const cur = S.onbDetail[i] !== undefined ? S.onbDetail[i] : (alwOf(j).length > 0 || rulesOf(j).length > 0); S.onbDetail[i] = !cur; }
  else if (a === "mode"){ st.mode = b.dataset.v; }
  else if (a === "mstart"){ if (b.dataset.v === "custom") S.onbMs = true; else { S.onbMs = false; st.monthStart = num(b.dataset.v); } }
  else if (a === "persona"){
    st.persona = b.dataset.v; st.walls = WALL_DEF[st.persona].slice();
    // jobs not filled in yet follow the new choice
    st.jobs = st.jobs.filter(j => String(j.name).trim() || num(j.wage) || num(j.salary));
  }
  else if (a === "paypreset"){ const j = st.jobs[Number(b.dataset.i)], pp = PAY_PRESETS[Number(b.dataset.p)]; setCycles(j, pp.cycles ? pp.cycles.map(c => Object.assign({}, c)) : [{cutoff: pp.c, payOffset: pp.o, payDay: pp.d}]); S.onbCustom[b.dataset.i] = false; }
  else if (a === "paycustom") S.onbCustom[b.dataset.i] = true;
  else if (a === "deljob") st.jobs.splice(Number(b.dataset.i), 1);
  else if (a === "preset"){
    const items = st.fixedItems || (st.fixedItems = []), n = b.dataset.name, i = items.findIndex(f => f.name === n);
    // no guessed amount: the field stays empty with the usual amount as a hint
    if (i >= 0) items.splice(i, 1); else { items.push({name: n, amount: "", hint: num(b.dataset.amount)}); setTimeout(() => { const el = document.getElementById("of-a-" + (items.length - 1)); if (el) el.focus(); }, 30); }
  }
  else if (a === "addfix"){ (st.fixedItems = st.fixedItems || []).push({name: "", amount: ""}); persist(); render(); const el = document.getElementById("of-n-" + (st.fixedItems.length - 1)); if (el) el.focus(); return; }
  else if (a === "delfix") st.fixedItems.splice(Number(b.dataset.i), 1);
  else if (a === "restart"){ if (S.confirmDel !== "restart"){ S.confirmDel = "restart"; render(); return; } S.confirmDel = null; st.onboarded = false; S.onbStep = 1; }
  else if (a === "wipe"){
    if (S.confirmDel !== "wipe"){ S.confirmDel = "wipe"; render(); return; }
    try { localStorage.removeItem(LS); } catch(_){}
    S.confirmDel = null; S.settings = clone(DEFAULTS); S.shifts = {}; S.events = {}; S.income = {}; S.ach = {}; S.onbStep = 0;
    render(); toast("データを消しました"); return;
  }
  persist(); render(); if (a === "next" || a === "back" || a === "restart") window.scrollTo(0, 0);
});

/* ---------- boot ---------- */
loadLocal();
[S.y, S.m] = refreshToday();
Object.keys(S.ready).forEach(k => { S.ready[k] = true; });
S.calState = "off";
render();
})();
</script>
</body>
</html>
